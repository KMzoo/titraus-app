/**
 * Arviointirivi 1-5. Selite on inline <details>, ei erillinen levy: aiemmin
 * i-napin painaminen avasi uuden levyn ja tuhosi kesken olevan kirjauksen.
 * Vieriva tabindex: ryhma on yksi tabulaattoripysakki, ei viisi.
 */
function rateHtml(nimi, otsikko, arvo, ankkurit){
  var h = ['<div class="field"><div class="rate-head"><span class="lbl" id="lbl_'+nimi+'">'+esc(otsikko)+'</span></div>'];
  h.push('<div class="rate" role="radiogroup" aria-labelledby="lbl_'+nimi+'">');
  var tabIdx = arvo ? arvo : 1;
  for(var v=1;v<=5;v++){
    h.push('<button type="button" role="radio" aria-checked="'+(arvo===v?"true":"false")+'" '
      +'tabindex="'+(v===tabIdx?"0":"-1")+'" '
      +'aria-label="'+v+', '+esc(ankkurit[v-1])+'" data-rate="'+esc(nimi)+'" data-v="'+v+'"><span class="num">'+v+'</span></button>');
  }
  h.push('</div>');
  h.push('<div class="rate-ends"><span>'+esc(ankkurit[0])+'</span><span style="text-align:right">'+esc(ankkurit[4])+'</span></div>');
  h.push('<div class="rate-caption" data-caption="'+esc(nimi)+'">'+(arvo?esc(ankkurit[arvo-1]):"")+'</div>');
  h.push('<details class="disc" style="margin:8px 0 0"><summary>Mitä numerot tarkoittavat</summary><div class="dbody">');
  for(var r=0;r<5;r++) h.push('<div style="display:flex;gap:10px;padding:3px 0"><b style="color:var(--text);min-width:14px">'+(r+1)+'</b><span>'+esc(ankkurit[r])+'</span></div>');
  h.push('<p class="hint" style="margin-top:8px">Sanamuodot pysyvät samoina viikosta toiseen, jotta arviosi ovat vertailukelpoisia. Sama taulukko tulostuu raporttiin.</p>');
  h.push('</div></details>');
  h.push('</div>');
  return h.join("");
}

/* ---------- annos ---------- */
function openDoseSheet(opts){
  var day = opts.day || todayKey();
  var ev = opts.eventId ? eventById(opts.eventId) : null;
  var slots = suunnitellut(day);
  var slot = ev ? ev.slot : (opts.slot || (slots[0] && slots[0].slot) || "muu");
  var slotDef = null;
  for(var i=0;i<slots.length;i++) if(slots[i].slot === slot) slotDef = slots[i];
  /* Vahvuudet tulevat lääkärin määräämästä suunnitelmasta, eivät sovelluksen
     omasta listasta. Sovellus ei tarjoa annoksia, joita ei ole määrätty. */
  var setti = {};
  jaksoFor(day).annokset.forEach(function(a){ (a.vaihtoehdot||[]).forEach(function(m){ setti[m] = 1; }); });
  if(ev && ev.mg) setti[ev.mg] = 1;
  var vaihtoehdot = Object.keys(setti).map(Number).sort(function(a,b){ return a-b; });
  if(!vaihtoehdot.length) vaihtoehdot = [18];
  var st = {
    mg: ev ? ev.mg : (slotDef ? slotDef.vaihtoehdot[0] : 18),
    at: ev ? ev.at : oletusLeima(day, slotDef ? slotDef.klo : "12:00"),
    slot: slot,
    status: ev ? ev.status : "otettu",
    syy: ev ? (ev.syy||"") : "",
    note: ev ? (ev.note||"") : "",
    id: ev ? ev.id : null
  };

  function body(){
    var h = [];
    h.push('<div class="field"><div class="lbl">Vahvuus<span class="opt">lääkärin määräämät</span></div><div class="seg wrap">');
    vaihtoehdot.forEach(function(mg){
      h.push('<button type="button" aria-pressed="'+(st.mg===mg&&st.status==="otettu"?"true":"false")+'" data-mg="'+mg+'">'+mg+' mg</button>');
    });
    h.push('<button type="button" aria-pressed="'+(st.muuAuki?"true":"false")+'" data-muu="1">Muu</button>');
    h.push('</div>');
    if(st.muuAuki){
      h.push('<input type="number" inputmode="numeric" min="1" max="200" step="1" data-muumg="1" value="'+(st.mg||"")+'" placeholder="Määrä milligrammoina" style="margin-top:8px" aria-label="Määrä milligrammoina">');
      h.push('<p class="hint">Kirjaa tähän vain se, minkä todella otit.</p>');
    }
    h.push('</div>');

    h.push('<div class="field"><div class="lbl">Kellonaika<span class="opt">oletuksena nyt</span></div><div class="chipwrap">');
    h.push('<button class="chip" type="button" data-time="now">Nyt</button>');
    h.push('<button class="chip" type="button" data-time="-15">−15 min</button>');
    h.push('<button class="chip" type="button" data-time="-30">−30 min</button>');
    h.push('<button class="chip" type="button" data-time="-60">−1 h</button>');
    h.push('</div><input type="time" value="'+esc(pad2(wallOf(st.at).h)+":"+pad2(wallOf(st.at).mi))+'" data-timeinput="1" style="margin-top:8px" aria-label="Tarkka kellonaika">');
    h.push('</div>');

    h.push('<div class="field"><div class="lbl">Mikä annos</div><div class="seg">');
    [["aamu","Aamu"],["lounas","Lounas"],["muu","Ylimääräinen"]].forEach(function(p){
      h.push('<button type="button" aria-pressed="'+(st.slot===p[0]?"true":"false")+'" data-slotpick="'+p[0]+'">'+p[1]+'</button>');
    });
    h.push('</div></div>');

    h.push('<div class="field"><div class="lbl">Muistiinpano<span class="opt">valinnainen</span></div>'
      +'<textarea data-note="1" placeholder="Esim. otin myöhässä, unohtui laukkuun">'+esc(st.note)+'</textarea></div>');

    h.push('<div class="field"><button class="btn btn-ghost" type="button" data-skip-dose="1">'
      +(st.status==="valiin" ? "Merkitty: en ottanut tätä annosta" : "En ottanut tätä annosta")+'</button>'
      +'<p class="hint">Ottamatta jäänyt annos on yhtä tärkeä tieto kuin otettu.</p></div>');

    h.push('<div class="field"><button class="btn btn-primary lg" type="button" data-done="1">Valmis</button></div>');
    return h.join("");
  }

  function tallenna(){
    var fields = { mg:st.mg, slot:st.slot, status:st.status, syy:st.syy, note:st.note, at:st.at,
                   day: logicalDay(st.at, STORE.settings.dayCutoffHour) };
    if(st.id){ updateEvent(st.id, fields); }
    else{ var e = addEvent("dose", st.at, {mg:st.mg, slot:st.slot, status:st.status, syy:st.syy, note:st.note}, fields.day); st.id = e.id; }
  }

  openSheet({
    title: ev ? "Muokkaa annosta" : "Kirjaa annos",
    sub: fmtDateShort(day),
    body: body(),
    onDelete: st.id ? function(){ var id = st.id; softDelete(id); closeSheet(); renderAll(); showUndo("Annos poistettu", id, null); } : null,
    onClose: function(){ renderAll(); },
    focus:false,
    after: function(){
      var b = el("sheetBody");
      b.addEventListener("click", function(ev2){
        var t = ev2.target.closest("[data-mg],[data-time],[data-slotpick],[data-skip-dose],[data-done],[data-muu]");
        if(!t) return;
        if(t.hasAttribute("data-muu")){ st.muuAuki = !st.muuAuki; rerenderSheet(b, body()); }
        else if(t.hasAttribute("data-mg")){ st.mg = +t.getAttribute("data-mg"); st.muuAuki = false; st.status = "otettu"; tallenna(); rerenderSheet(b, body()); }
        else if(t.hasAttribute("data-time")){
          var v = t.getAttribute("data-time");
          st.at = v === "now" ? oletusLeima(day, slotDef ? slotDef.klo : "12:00")
                              : isoLocal(new Date(new Date(st.at).getTime() + (+v)*60000));
          tallenna(); rerenderSheet(b, body());
        }
        else if(t.hasAttribute("data-slotpick")){ st.slot = t.getAttribute("data-slotpick"); tallenna(); rerenderSheet(b, body()); }
        else if(t.hasAttribute("data-skip-dose")){ st.status = st.status==="valiin" ? "otettu" : "valiin"; tallenna(); rerenderSheet(b, body()); }
        else if(t.hasAttribute("data-done")){ closeSheet(); }
      });
      b.addEventListener("change", function(ev2){
        var t = ev2.target;
        if(t.hasAttribute("data-timeinput")){
          var p = String(t.value||"").split(":");
          if(p.length===2){ var w = wallOf(st.at); var d = new Date(w.y, w.mo-1, w.d, +p[0], +p[1], 0, 0); st.at = isoLocal(d); tallenna(); }
        }
      });
      b.addEventListener("input", function(ev2){
        if(ev2.target.hasAttribute("data-note")){ st.note = ev2.target.value; tallenna(); }
        else if(ev2.target.hasAttribute("data-muumg")){
          var v = parseInt(ev2.target.value, 10);
          if(isFinite(v) && v > 0 && v <= 200){ st.mg = v; st.status = "otettu"; tallenna(); }
        }
      });
    }
  });
}

/* ---------- haittavaikutukset ---------- */
function toggleSideEffect(day, id){
  var def = seById(id) || (STORE.settings.omat.filter(function(o){return o.id===id;})[0]);
  if(!def) return;
  /* yöoireet kirjataan edelliselle päivälle - ks. seKohdePaiva */
  var kohde = seKohdePaiva(day, def);
  var nyt = tikatutTanaan(day);

  if(nyt[id]){
    typesOfDay(kohde,"sideeffects").forEach(function(e){
      if(!e.items) return;
      var j = e.items.filter(function(it){ return it.id !== id; });
      if(j.length !== e.items.length){
        if(j.length) updateEvent(e.id, {items:j}); else softDelete(e.id);
      }
    });
  }else{
    /* poista "ei haittavaikutuksia" -merkintä kohdepäivältä, jos sellainen on */
    typesOfDay(kohde,"sideeffects").forEach(function(e){ if(e.none) softDelete(e.id); });
    var ses = typesOfDay(kohde,"sideeffects").filter(function(e){ return !e.none && !e.deleted; });
    var host = ses[ses.length-1];
    var item = {id:id, label:def.n, severity:null};
    if(host && Math.abs(new Date() - new Date(host.at)) < 90*60000){
      updateEvent(host.id, {items:(host.items||[]).concat([item])});
    }else{
      var e2 = addEvent("sideeffects", nowIso(), {items:[item], note:""}, kohde);
      if(kohde !== day) updateEvent(e2.id, {dayManual:true});
    }
    if(def.yo && !SHEET.avoin){
      naytaViesti(def.n+" · kirjattu yölle "+fmtDateShort(kohde)+" → "+fmtDateShort(addDays(kohde,1)));
    }
  }
  renderAll();
}
/**
 * "Ei haittavaikutuksia tänään" ei saa hiljaa hävittää jo kirjattuja oireita.
 * Palauttaa poistettujen tunnisteet, jotta toiminto on peruttavissa.
 */
function merkitseEiHaittoja(day){
  var poistetut = [];
  typesOfDay(day,"sideeffects").forEach(function(e){ poistetut.push(e.id); softDelete(e.id); });
  addEvent("sideeffects", nowIso(), {none:true, items:[]}, day);
  renderAll();
  return poistetut;
}
function peruEiHaittoja(day, poistetut){
  typesOfDay(day,"sideeffects").forEach(function(e){ if(e.none) softDelete(e.id); });
  poistetut.forEach(undelete);
  renderAll();
}
/** Kutsutaan napista: varoittaa vain jos päivälle on jo kirjattu oireita. */
function eiHaittojaNapista(day){
  var oireita = 0;
  typesOfDay(day,"sideeffects").forEach(function(e){ if(!e.none) oireita += (e.items||[]).length; });
  var poistetut = merkitseEiHaittoja(day);
  if(oireita){
    showUndo("Poistettiin "+oireita+(oireita===1?" oire":" oiretta")+" ja merkittiin: ei haittavaikutuksia", null, null);
    var d = day, p = poistetut;
    el("undoBtn").onclick = function(){ peruEiHaittoja(d, p); hideUndo(); el("undoBtn").onclick = null; };
  }
}

function openSideEffectSheet(day){
  day = day || todayKey();

    h.push('<button class="btn '+(ei?"btn-outline":"btn-quiet")+'" type="button" data-none="1" style="margin-top:12px">'
      +(ei ? "✓ Ei haittavaikutuksia tänään" : "Ei haittavaikutuksia tänään")+'</button>');

    function chip(x){
      return '<button class="chip tick" type="button" aria-pressed="'+(tikat[x.id]?"true":"false")+'" data-se="'+esc(x.id)+'"'

    });
    if(STORE.settings.omat.length){

      h.push('</div>');

    if(J.harvinaiset.length){
      h.push('<details class="disc" data-keep="harv" style="margin-top:14px"><summary>Muut oireet ('+J.harvinaiset.length+')</summary><div class="dbody">');
      h.push('<p>Nämä eivät ole oletuslistalla. Kun merkitset jonkin näistä, se siirtyy omaan ryhmäänsä näkyville seuraavasta päivästä alkaen.</p>');

        h.push('<div style="font-size:.75rem;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px">'+esc(r.nimi)+'</div><div class="chipwrap">');
        its.forEach(function(x){ h.push(chip(x)); });
        h.push('</div>');
      });
      h.push('</div></details>');
    }
    h.push('<div class="field"><button class="btn btn-quiet" type="button" data-addown="1">+ Lisää oma oire</button></div>');

      +'<div style="margin-top:10px"><button class="btn sm btn-ghost" type="button" data-redflag="1">Katso lista</button></div></div></div>');

    h.push('<div class="field"><button class="btn btn-primary lg" type="button" data-done="1">Valmis</button></div>');

  }
  openSheet({
    title:"Haittavaikutukset", sub: fmtDateShort(day), body: body(), focus:false,
    onClose:function(){ renderAll(); },
    after:function(){
      var b = el("sheetBody");
      b.addEventListener("click", function(e){
        var t = e.target.closest("[data-se],[data-none],[data-done],[data-redflag],[data-addown]");
        if(!t) return;
        if(avattuTanaan && todayKey() !== day){   /* päivä vaihtui levyn ollessa auki */
          closeSheet(); setTimeout(function(){ openSideEffectSheet(todayKey()); }, 220); return;
        }
        if(t.hasAttribute("data-se")){ toggleSideEffect(day, t.getAttribute("data-se")); rerenderSheet(b, body()); }
        else if(t.hasAttribute("data-none")){
          if(onEiHaittoja(day)){ typesOfDay(day,"sideeffects").forEach(function(x){ if(x.none) softDelete(x.id); }); renderAll(); }
          else eiHaittojaNapista(day);
          rerenderSheet(b, body());
        }
        else if(t.hasAttribute("data-redflag")) openRedFlags(day);
        else if(t.hasAttribute("data-addown")) openAddOwn(day, function(){ rerenderSheet(b, body()); });
        else if(t.hasAttribute("data-done")) closeSheet();
      });
    }
  });

   8. ANALYYSI
   Perussääntö: puuttuvaa arviota ei koskaan täytetä eikä ekstrapoloida.

function kaikkiPaivat(){
  var set = {};
  elavat().forEach(function(e){ set[e.day] = 1; });
  var ks = Object.keys(set).sort();
  return ks;
}

function paivaTietue(key){
  var evs = eventsOfDay(key);
  var d = {
    key:key,
    tyyppi: paivanTyyppi(key),
    doses: [], checkins: [], sideeffects: [], redflags: [], vitals: [], notes: [],
    wrapup:null, sleep:null, offset:null,
    eiHaittoja:false
  };
  evs.forEach(function(e){
    if(e.type==="dose") d.doses.push(e);
    else if(e.type==="checkin"){ if(e.scores && e.scores.keskittyminen!=null) d.checkins.push(e); else d.checkins.push(e); }
    else if(e.type==="sideeffects"){ if(e.none) d.eiHaittoja = true; else d.sideeffects.push(e); }
    else if(e.type==="wrapup") d.wrapup = e;
    else if(e.type==="sleep") d.sleep = e;
    else if(e.type==="offset") d.offset = e;   /* viimeisin voittaa, evs on aikajarjestyksessa */
    else if(e.type==="redflag") d.redflags.push(e);
    else if(e.type==="vitals") d.vitals.push(e);
    else if(e.type==="note") d.notes.push(e);
  });
  d.checkins.sort(function(a,b){ return new Date(a.at) - new Date(b.at); });
  var aamu = null, lounas = null;
  d.doses.forEach(function(x){
    if(x.status !== "otettu") return;
    if(x.slot==="aamu") aamu = x;
    if(x.slot==="lounas") lounas = x;
  });
  d.aamu = aamu; d.lounas = lounas;
  d.aamuMg = aamu ? aamu.mg : null;
  d.haitat = [];
  d.sideeffects.forEach(function(e){ (e.items||[]).forEach(function(it){ d.haitat.push({id:it.id, label:it.label, at:e.at}); }); });
  d.liikaa = d.checkins.some(function(c){ return c.tuntuma === "liikaa"; })
          || d.haitat.some(function(x){ var s = seById(x.id); return s && s.yli; });
  d.onKirjauksia = !!(d.doses.length || d.checkins.length || d.sideeffects.length || d.eiHaittoja
                   || d.wrapup || d.offset || d.notes.length || d.redflags.length || d.vitals.length || d.sleep);
  return d;
}

var _tilastoCache = null, _tilastoAvain = null;

  var avain = STORE.meta.writeCounter + "|" + STORE.events.length + "|" + todayKey();

  var paivat = kaikkiPaivat().map(paivaTietue).filter(function(d){ return d.onKirjauksia; });
  var st = { paivat: paivat, paiviaKirjattu: paivat.length };
  _tilastoCache = st; _tilastoAvain = avain;
  return st;
}

/* Oirejarjestys on tarkoituksella jaadytetty paivaksi, mutta tuonti ja pyyhinta
   muuttavat historiaa niin paljon, etta jaadytys olisi vaarassa. */

/** Työpäivät joilla on kirjattu aamuannos, ryhmiteltynä aamuannoksen mg:n mukaan. */
function annosRyhmat(vainTyopaivat){
  var st = kerayTilastot();
  var g = {};
  st.paivat.forEach(function(d){
    if(vainTyopaivat !== false && d.tyyppi !== "tyo") return;
    if(d.aamuMg == null) return;
    (g[d.aamuMg] = g[d.aamuMg] || []).push(d);
  });
  return g;
}
function ryhmaVarit(mg){
  if(+mg === 18) return "var(--dose-18)";
  if(+mg === 36) return "var(--dose-36)";
  return "var(--slot-muu)";
}

/* --- lokerointi 2 tunnin väleihin --- */
var LOKEROT = [[7,9,8],[9,11,10],[11,13,12],[13,15,14],[15,17,16],[17,19,18],[19,21,20]];
function paivanLokerot(d){
  var out = LOKEROT.map(function(){ return []; });
  d.checkins.forEach(function(c){
    var v = c.scores ? c.scores.keskittyminen : null;
    if(v == null) return;
    var hh = wallHours(c.at);
    for(var i=0;i<LOKEROT.length;i++){
      if(hh >= LOKEROT[i][0] && hh < LOKEROT[i][1]){ out[i].push(v); break; }
    }
  });
  return out.map(function(a){ return a.length ? mean(a) : null; });
}

/**
 * Arvio siitä, milloin vaikutus loppui.
 * Oikealta sensuroitu päivä ei koskaan saa kellonaikaa - muuten
 * aikaisin lopetettu kirjaaminen näyttäisi lyhyeltä vaikutukselta.
 */
function paattyminen(d){
  if(d.offset) return { tila:"kirjattu", klo: wallHours(d.offset.at) };
  var c = d.checkins.filter(function(x){ return x.scores && x.scores.keskittyminen != null; })
                    .map(function(x){ return { klo: wallHours(x.at), teho: x.scores.keskittyminen }; });
  if(!c.length) return { tila:"ei-kirjauksia" };

  var huippu = 0;
  for(var i=1;i<c.length;i++) if(c[i].teho > c[huippu].teho) huippu = i;
  if(c[huippu].teho < 3) return { tila:"ei-selvaa-vaikutusta" };

  var viim = -1;
  for(var j=huippu;j<c.length;j++) if(c[j].teho >= 3) viim = j;
  if(viim < 0) return { tila:"ei-selvaa-vaikutusta" };

  var eka2 = -1;
  for(var k=viim+1;k<c.length;k++){ if(c[k].teho <= 2){ eka2 = k; break; } }

  if(eka2 < 0){
    return c[viim].klo < 15
      ? { tila:"ei-iltapaivan-tietoa", viimeinen:c[viim].klo }
      : { tila:"jatkui-viela", viimeinen:c[viim].klo };
  }
  var vali = c[eka2].klo - c[viim].klo;
  if(vali > 3) return { tila:"vali", alku:c[viim].klo, loppu:c[eka2].klo };

  var x = c[viim].klo + (c[viim].teho - 2.5) / (c[viim].teho - c[eka2].teho) * vali;
  var vaihteleva = false;
  for(var m=eka2+1;m<c.length;m++) if(c[m].teho >= 3) vaihteleva = true;
  return { tila:"arvio", klo: Math.round(x*4)/4, vaihteleva:vaihteleva };
}
function paattymisTeksti(p){
  if(!p) return "";
  switch(p.tila){
    case "kirjattu": return "kirjasit: loppui klo "+fmtHoursClock(p.klo);
    case "arvio": return "loppui noin klo "+fmtHoursClock(p.klo);
    case "jatkui-viela": return "vielä riittävä klo "+fmtHoursClock(p.viimeinen)+" (viimeinen kirjaus)";
    case "ei-iltapaivan-tietoa": return "ei iltapäivän kirjausta";
    case "vali": return "loppui klo "+fmtHoursClock(p.alku)+"–"+fmtHoursClock(p.loppu)+" välillä";
    case "ei-selvaa-vaikutusta": return "ei selvää vaikutusta";
    default: return "ei kirjauksia";
  }
}

      else if(e.type==="checkin") nimi = "Keskittyminen "+(tehoOfCheckin(e)!=null?tehoOfCheckin(e):"–")+(e.tuntuma?" · "+tuntumaNimi(e.tuntuma):"");
      else if(e.type==="sideeffects") nimi = e.none ? "Ei haittavaikutuksia" : (e.items||[]).map(function(i){return i.label;}).join(", ");
      else if(e.type==="wrapup") nimi = "Iltakirjaus · "+iltaTiivis(e);

      else if(e.type==="offset") nimi = "Vaikutus loppui";

      h.push('<div class="dayrow"><span class="t">'+fmtTime(e.at)+'</span><span class="m" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(nimi)+'</span>'
        +'<button class="a" type="button" data-open-event="'+esc(e.id)+'">Muokkaa</button></div>');
    });

    var style = (wd===1 && k!==tanaan) ? ' style="margin-top:6px"' : '';
    if(p){
      h.push('<button class="hrow" type="button" data-day="'+esc(k)+'" aria-current="'+(HIST_SEL===k?"true":"false")+'"'+style+'>'
        +'<span class="hd">'+esc(fmtDateShort(k))+'</span>'
        +'<span class="hmg">'+(p.aamuMg!=null?p.aamuMg:"")+'</span>'
        +miniBandHtml(p, 14)
        +(p.redflags.length?'<span class="dot" style="display:block;background:var(--danger)" role="img" aria-label="Vakava oire kirjattu"></span>':'')
        +'<span class="hch" aria-hidden="true">›</span></button>');
    }else{
      h.push('<button class="hrow tyhja" type="button" data-day="'+esc(k)+'" aria-current="'+(HIST_SEL===k?"true":"false")+'"'+style+'>'
        +'<span class="hd">'+esc(fmtDateShort(k))+'</span><span class="hmg"></span>'
        +'<span class="mband" style="height:14px" aria-hidden="true"><span class="mb-18"></span></span>'
        +'<span class="hch" aria-hidden="true">›</span></button>');
    }
  }
  h.push('</div>');
  if(daysBetween(eka, tanaan) + 1 > HIST_MAX_ROWS) h.push('<p class="hint">Näytetään '+HIST_MAX_ROWS+' viimeisintä päivää. Vanhemmat ovat tallessa ja mukana raportissa.</p>');
  h.push('<p class="hint" style="margin-top:10px">Tyhjä rivi = ei kirjauksia sinä päivänä. Mitään ei täytetä puolestasi.</p>');
  el("scr-history").innerHTML = h.join("");
}

    +'<button class="chip" type="button" data-addhere="1">+ Lisää kirjaus</button></div>');

    h.push('<div class="empty">Ei kirjauksia tältä päivältä.</div>');

  openSheet({

        else if(t.hasAttribute("data-fill")){ taytaAnnos(t.getAttribute("data-fill")); closeSheet(); setTimeout(function(){ openDay(key); },220); }
        else if(t.hasAttribute("data-skip")){ ohitaAnnos(t.getAttribute("data-skip")); closeSheet(); setTimeout(function(){ openDay(key); },220); }

}

/* --- A. Aamuannokset rinnakkain --- */
function osioAnnosvertailu(){
  var g = annosRyhmat(true);
  var kaikkiMgs = Object.keys(g).map(Number).sort(function(a,b){return a-b;});
  /* Vain vahintaan kolmen tyopaivan haarat paasevat vertailuun. Yhden paivan
     haara saisi muuten oman sarakkeen keskiarvoja, jotka nayttaisivat tulokselta. */
  var mgs = kaikkiMgs.filter(function(m){ return g[m].length >= 3; });
  var poisJatetyt = kaikkiMgs.filter(function(m){ return g[m].length < 3; });
  var h = ['<h2 class="sec">Aamuannokset rinnakkain</h2>'];

  if(mgs.length < 2){
    var mgsN = kaikkiMgs;
    h.push('<div class="gate"><span class="ttl">Vertailu avautuu, kun molemmilla annoksilla on vähintään 3 kirjattua työpäivää.</span>');
    if(!mgsN.length){ h.push('Kirjaa aamuannos työpäivinä, niin vertailu alkaa kertyä.'); }
    else{
      h.push('<div style="margin-top:8px">');
      mgsN.forEach(function(m){
        var n = g[m].length;
        var pips = '<span class="pips">';
        for(var i=0;i<3;i++) pips += '<i class="'+(i<n?"f":"")+'"></i>';
        pips += '</span>';
        h.push('<div style="margin:4px 0"><b style="color:var(--text)">'+m+' mg</b> '+nPaivaa(n)+' '+pips+'</div>');
      });
      h.push('</div>');
    }
    h.push('<div style="margin-top:10px;font-size:.8125rem">Vertailu on piilossa, kirjaukset eivät — päiväraita alempana näyttää kaikki päiväsi jo nyt.</div></div>');
    return h.join("");
  }

  var vahva = mgs.some(function(m){ return g[m].length < 5; });
  h.push('<div class="caveat">Perustuu '+mgs.map(function(m){ return '<b>'+nPaivaan(g[m].length)+' '+m+' mg:lla</b>'; }).join(" ja ")+'. '
    + (vahva ? 'Liian vähän varmoihin johtopäätöksiin. Katso päivät yksitellen, älä pelkkää keskiarvoa.'
             : 'Suuntaa antava, ei todiste — päivien välinen vaihtelu on suurta.')+'</div>');

  if(poisJatetyt.length){
    h.push('<p class="hint" style="margin:-4px 0 8px">Vertailun ulkopuolella: '
      +esc(poisJatetyt.map(function(m){ return m+' mg ('+nPaivaa(g[m].length)+')'; }).join(' · '))
      +' — alle kolme työpäivää.</p>');
  }
  h.push('<div class="card tight">'+kayraSvg(g, mgs)+'</div>');
  h.push(paallekkaisyysNauha(g, mgs));
  h.push(tukiluvut(g, mgs));
  h.push(sekoittavat(g, mgs));
  return h.join("");
}

function kayraSvg(g, mgs){
  var W=334, H=190, L=24, R=30, T=10, B=46;
  var x0=L, x1=W-R, y0=T, y1=H-B;
  function X(hh){ return x0 + (hh-6.5)/(21.5-6.5)*(x1-x0); }
  function Y(v){ return y1 - (v-1)/4*(y1-y0); }
  var s = [];

  [2,3,4].forEach(function(v){
    s.push('<line x1="'+x0+'" y1="'+Y(v).toFixed(1)+'" x2="'+x1+'" y2="'+Y(v).toFixed(1)+'" stroke="'+(v===3?"var(--rule-strong)":"var(--grid)")+'" stroke-width="1"/>');
  });
  s.push('<line x1="'+x0+'" y1="'+Y(1)+'" x2="'+x1+'" y2="'+Y(1)+'" stroke="var(--rule-strong)" stroke-width="1"/>');
  [1,2,3,4,5].forEach(function(v){
    s.push('<text x="'+(x0-6)+'" y="'+(Y(v)+3.5).toFixed(1)+'" text-anchor="end" font-size="10" fill="var(--text-3)">'+v+'</text>');
  });
  /* Arvon 3 ankkuria ei merkitä akselille - teksti leikkautuisi kapealla näytöllä.
     Se kerrotaan kuvatekstissä ja viiva piirretään vahvempana. */

  [8,10,12,14,16,18,20].forEach(function(t){
    s.push('<text x="'+X(t).toFixed(1)+'" y="'+(y1+14)+'" text-anchor="middle" font-size="10" fill="var(--text-3)">'+t+'</text>');
  });
  s.push('<line x1="'+X(18).toFixed(1)+'" y1="'+y0+'" x2="'+X(18).toFixed(1)+'" y2="'+y1+'" stroke="var(--rule-strong)" stroke-width="1"/>');
  s.push('<text x="'+X(18).toFixed(1)+'" y="'+(y0+9)+'" text-anchor="middle" font-size="9" fill="var(--text-2)">klo 18</text>');

  var nRivit = [];
  mgs.forEach(function(mg){
    var vari = ryhmaVarit(mg);
    var paivat = g[mg];
    var op = paivat.length >= 5 ? 0.22 : 0.35;
    paivat.forEach(function(d){
      var lk = paivanLokerot(d), pts = [];
      for(var i=0;i<lk.length;i++){ if(lk[i]!=null) pts.push({x:X(LOKEROT[i][2]), y:Y(lk[i]), i:i}); }
      for(var j=1;j<pts.length;j++){
        if(pts[j].i - pts[j-1].i > 1 && (LOKEROT[pts[j].i][2]-LOKEROT[pts[j-1].i][2]) > 3) continue;
        s.push('<line x1="'+pts[j-1].x.toFixed(1)+'" y1="'+pts[j-1].y.toFixed(1)+'" x2="'+pts[j].x.toFixed(1)+'" y2="'+pts[j].y.toFixed(1)+'" stroke="'+vari+'" stroke-width="1" stroke-opacity="'+op+'"/>');
      }
    });
    var ka = [], ns = [];
    for(var i2=0;i2<LOKEROT.length;i2++){
      var arvot = [];
      paivat.forEach(function(d){ var v = paivanLokerot(d)[i2]; if(v!=null) arvot.push(v); });
      ka.push(arvot.length ? mean(arvot) : null); ns.push(arvot.length);
    }
    nRivit.push({mg:mg, ns:ns, vari:vari});
    var seg = [];
    for(var i3=0;i3<ka.length;i3++){
      if(ka[i3]!=null && ns[i3]>=2) seg.push({x:X(LOKEROT[i3][2]), y:Y(ka[i3])});
      else { if(seg.length>1) s.push(polyl(seg, vari, mg)); seg = []; }
    }
    if(seg.length>1) s.push(polyl(seg, vari, mg));
    for(var i4=0;i4<ka.length;i4++){
      if(ka[i4]==null) continue;
      var cx = X(LOKEROT[i4][2]), cy = Y(ka[i4]);
      if(ns[i4] >= 2) s.push('<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="4" fill="'+vari+'" stroke="var(--surface)" stroke-width="2"/>');
      else s.push('<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="4" fill="var(--surface)" stroke="'+vari+'" stroke-width="1.5"/>');
    }
    var vikaI = -1; for(var i5=0;i5<ka.length;i5++) if(ka[i5]!=null) vikaI = i5;
    if(vikaI>=0) s.push('<text x="'+(X(LOKEROT[vikaI][2])+7).toFixed(1)+'" y="'+(Y(ka[vikaI])+3.5).toFixed(1)+'" font-size="10" font-weight="700" fill="var(--text-2)">'+mg+'</text>');
  });
  function polyl(pts, vari, mg){
    return '<polyline points="'+pts.map(function(p){return p.x.toFixed(1)+","+p.y.toFixed(1);}).join(" ")
      +'" fill="none" stroke="'+vari+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'
      +(+mg===36?' stroke-dasharray="6 4"':'')+'/>';
  }
  /* n-nauha */
  var yN = y1 + 26;
  nRivit.forEach(function(r, ri){
    var yy = yN + ri*13;
    s.push('<line x1="'+x0+'" y1="'+(yy-3.5)+'" x2="'+(x0+10)+'" y2="'+(yy-3.5)+'" stroke="'+r.vari+'" stroke-width="2"'+(+r.mg===36?' stroke-dasharray="4 3"':'')+'/>');
    s.push('<text x="'+(x0+14)+'" y="'+yy+'" font-size="9" fill="var(--text-3)">'+r.mg+'</text>');
    r.ns.forEach(function(n,i){ s.push('<text x="'+X(LOKEROT[i][2]).toFixed(1)+'" y="'+yy+'" text-anchor="middle" font-size="9" fill="var(--text-3)">'+n+'</text>'); });
  });
  H = yN + nRivit.length*13 + 4;

  var alt = "Keskittyminen tunneittain, "+mgs.map(function(m){return m+" mg";}).join(" ja ")+".";
  return '<div style="font-size:.8125rem;font-weight:600;margin-bottom:2px">Keskittyminen kellonajan mukaan</div>'
    +'<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(alt)+'">'+s.join("")+'</svg>'
    +'<p class="hint" style="margin-top:4px">Ohuet viivat ovat yksittäisiä päiviä. Paksu viiva piirretään vain sinne, missä sen takana on vähintään kaksi päivää; ontto piste tarkoittaa yhtä päivää. Alarivi kertoo päivien määrän kussakin kohdassa. Vahvempi vaakaviiva on arvo 3 eli riittävä keskittyminen.</p>';
}

function paallekkaisyysNauha(g, mgs){
  var W=334, H=24+mgs.length*26, L=42, R=14;
  var x0=L, x1=W-R;
  function X(v){ return x0 + (v-1)/4*(x1-x0); }
  var s = [];
  [1,2,3,4,5].forEach(function(v){
    s.push('<line x1="'+X(v).toFixed(1)+'" y1="6" x2="'+X(v).toFixed(1)+'" y2="'+(H-16)+'" stroke="var(--grid)" stroke-width="1"/>');
    s.push('<text x="'+X(v).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" font-size="9" fill="var(--text-3)">'+v+'</text>');
  });
  var risti = false, alueet = [];
  mgs.forEach(function(mg, ri){
    var yy = 18 + ri*26;
    var vari = ryhmaVarit(mg);
    s.push('<text x="0" y="'+(yy+3.5)+'" font-size="10" font-weight="700" fill="var(--text-2)">'+mg+' mg</text>');
    var ka = [];
    g[mg].forEach(function(d, di){
      var vals = d.checkins.map(function(c){ return c.scores?c.scores.keskittyminen:null; }).filter(function(x){return x!=null;});
      if(!vals.length) return;
      var m = mean(vals); ka.push(m);
      var jitter = ((di % 3) - 1) * 3.5;
      var ontto = !d.lounas;
      s.push('<circle cx="'+X(m).toFixed(1)+'" cy="'+(yy+jitter).toFixed(1)+'" r="4" fill="'+(ontto?"var(--surface)":vari)
        +'" stroke="'+(ontto?vari:"var(--surface)")+'" stroke-width="'+(ontto?1.5:2)+'"/>');
    });
    if(ka.length){
      var md = median(ka);
      s.push('<line x1="'+X(md).toFixed(1)+'" y1="'+(yy-10)+'" x2="'+X(md).toFixed(1)+'" y2="'+(yy+10)+'" stroke="'+vari+'" stroke-width="2"/>');
      alueet.push({mg:mg, min:Math.min.apply(null,ka), max:Math.max.apply(null,ka), n:ka.length});
    }
  });
  if(alueet.length===2) risti = !(alueet[0].max < alueet[1].min || alueet[1].max < alueet[0].min);

  var lause = "";
  if(alueet.length===2){
    if(risti){
      if(alueet[0].max === alueet[1].max){
        lause = "Päivät menevät ristiin: molempien annosten paras päivä sai saman keskiarvon.";
      }else{
      var korkein = alueet[0].max > alueet[1].max ? alueet[0] : alueet[1];
      var toinen = korkein === alueet[0] ? alueet[1] : alueet[0];
      lause = "Päivät menevät ristiin: joukossa on "+korkein.mg+" mg:n päiviä, jotka arvioit paremmiksi kuin paras "+toinen.mg+" mg:n päivä.";
      }
    }else{
      var yl = alueet[0].min > alueet[1].max ? alueet[0] : alueet[1];
      var n = alueet[0].n + alueet[1].n;   /* vain päivät, joilta on arvio */
      lause = "Näissä kirjauksissa jokainen "+yl.mg+" mg:n päivä sai korkeamman keskiarvon kuin yksikään toisen annoksen päivä. Arvioituja päiviä on silti vain "+n+".";
    }
  }
  return '<div class="card tight" style="margin-top:12px">'
    +'<div style="font-size:.8125rem;font-weight:600;margin-bottom:2px">Päivien keskiarvot yksitellen</div>'
    +'<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Kunkin päivän keskittymisen keskiarvo annoksittain">'+s.join("")+'</svg>'
    +(lause?'<p class="hint" style="margin-top:4px">'+esc(lause)+'</p>':'')
    +'<p class="hint">Ontto piste = päivä, jolta lounasannos puuttuu. Pystyviiva on ryhmän mediaani.</p></div>';
}

function tukiluvut(g, mgs){
  function ka(paivat, f){ var a = []; paivat.forEach(function(d){ var v = f(d); if(v!=null) a.push(v); }); return {v:mean(a), n:a.length}; }
  function tehoIkkuna(d, lo, hi){
    var a = d.checkins.filter(function(c){ var hh=wallHours(c.at); return hh>=lo&&hh<hi&&c.scores&&c.scores.keskittyminen!=null; })
                      .map(function(c){ return c.scores.keskittyminen; });
    return a.length ? mean(a) : null;
  }
  var rivit = [
    ["Päiviä (työpäiviä)", function(p){ return {teksti:String(p.length)}; }],
    ["Keskittymisen päiväkeskiarvo", function(p){ var r = ka(p, function(d){ var a=d.checkins.map(function(c){return c.scores?c.scores.keskittyminen:null;}).filter(function(x){return x!=null;}); return a.length?mean(a):null; }); return {teksti:num1(r.v), n:r.n, tot:p.length}; }],
    ["Keskittyminen klo 16–19", function(p){ var r = ka(p, function(d){ return tehoIkkuna(d,16,19); }); return {teksti:num1(r.v), n:r.n, tot:p.length}; }],
    ["Haittamerkintöjä / päivä", function(p){
      /* vain paivat, joilta haitat on arvioitu: nolla merkitsee "ei haittoja",
         ei "ei kysytty" - muuten kirjaamatta jaaneet paivat laimentaisivat luvun */
      var arvioidut = p.filter(function(d){ return d.haitat.length > 0 || d.eiHaittoja; });
      var r = ka(arvioidut, function(d){ return d.haitat.length; });
      return {teksti:num1(r.v), n:r.n, tot:p.length}; }],
    ["Päiviä, joilla merkki liiasta", function(p){ var c = p.filter(function(d){ return d.liikaa; }).length; return {teksti:nPaivaa(c)}; }],
    ["Päivä kokonaisuutena", function(p){ var r = ka(p, function(d){ return d.wrapup?d.wrapup.paiva:null; }); return {teksti:num1(r.v), n:r.n, tot:p.length}; }],
    ["Unen laatu seuraavana yönä", function(p){ var r = ka(p, function(d){ return d.sleep?d.sleep.laatu:null; }); return {teksti:num1(r.v), n:r.n, tot:p.length}; }],
    ["Nukahtaminen yli 30 min", function(p){ var y=0,t=0; p.forEach(function(d){ if(d.sleep&&d.sleep.nukahtaminen){ t++; if(d.sleep.nukahtaminen==="m30_60"||d.sleep.nukahtaminen==="yli60") y++; } }); return {teksti: t ? (y+" / "+nYota(t)) : "–"}; }],
    ["Lounasannos otettu", function(p){ var y=p.filter(function(d){return !!d.lounas;}).length; return {teksti:y+" / "+p.length+" pv"}; }],
    ["Iltapäiväkirjaus olemassa", function(p){ var y=p.filter(function(d){ return d.checkins.some(function(c){ return wallHours(c.at)>=15; }); }).length; return {teksti:y+" / "+p.length+" pv"}; }]
  ];
  var h = ['<div class="scrollx" style="margin-top:12px"><table class="data"><thead><tr><th>Mitta</th>'];
  mgs.forEach(function(m){ h.push('<th>'+m+' mg</th>'); });
  h.push('</tr></thead><tbody>');
  rivit.forEach(function(r){
    h.push('<tr><td>'+esc(r[0])+'</td>');
    mgs.forEach(function(m){
      var res = r[1](g[m]);
      h.push('<td>'+esc(res.teksti)+(res.n!=null && res.tot!=null && res.n!==res.tot ? ' <em>('+res.n+' pv)</em>' : '')+'</td>');
    });
    h.push('</tr>');
  });
  h.push('</tbody></table></div>');
  h.push('<p class="hint">Yhtään lukua ei korosteta eikä paremmuutta merkitä. Rivi ”liikaa”-merkeistä on ainoa kohta, jossa ”tuntuu paremmalta” ja ”on liikaa” erottuvat toisistaan.</p>');
  return h.join("");
}

function sekoittavat(g, mgs){
  var h = ['<details class="disc"'+(kerayTilastot().paiviaKirjattu < 14 ? " open":"")+'><summary>Mikä muu erosi näiden päivien välillä?</summary><div class="dbody">'];
  h.push('<p>Osa erosta voi tulla mistä tahansa alla olevasta — ei pelkästä annoksesta.</p>');
  mgs.forEach(function(m){
    var p = g[m];
    var ajat = p.filter(function(d){return d.aamu;}).map(function(d){ return wallHours(d.aamu.at); });
    var lounasAjat = p.filter(function(d){return d.lounas;}).map(function(d){ return wallHours(d.lounas.at); });
    var vp = {};
    p.forEach(function(d){ var w = VIIKONPAIVAT[keyToDate(d.key).getDay()]; vp[w] = (vp[w]||0)+1; });
    h.push('<p><b style="color:var(--text)">'+m+' mg</b><br>'
      +'Aamuannoksen mediaaniaika klo '+(ajat.length?fmtHoursClock(median(ajat)):"–")+'. '
      +'Lounasannos '+(lounasAjat.length?("klo "+fmtHoursClock(median(lounasAjat))+", "+lounasAjat.length+"/"+p.length+" päivänä"):"ei kirjattuna")+'.<br>'
      +'Viikonpäivät: '+esc(Object.keys(vp).map(function(k){return k+" "+vp[k];}).join(", "))+'.</p>');
  });
  h.push('<p>Muita mahdollisia eroja: edellisen yön uni, työpäivän raskaus, ja se, että ensimmäiset lääkepäivät tuntuvat usein eri tavalta kuin myöhemmät. Arviot ovat sinun omiasi, etkä ollut sokkona annoksen suhteen.</p>');
  h.push('<p>Vertailu on tulkittavampi silloin, kun samaa aamuannosta on käytetty useampana päivänä peräkkäin. Annostelusta sovit lääkärisi kanssa.</p>');
  h.push('</div></details>');
  return h.join("");
}
/* --- Minikaista: yhden päivän tuntisolut HTML-spaneina. Sama solulogiikka kuin
   Trendit-päiväraidassa (mitattu = täysi, silloitettu ≤3 h = kapea, muuten tyhjä).
   Käytetään Historia-riveillä ja raportin strip-osiossa. --- */
function paivaSolut(d){
  var T0 = 7, T1 = 22, SPAN = T1 - T0;
  var pts = d.checkins.filter(function(c){ return c.scores && c.scores.keskittyminen!=null; })
                      .map(function(c){ return {h:wallHours(c.at), v:c.scores.keskittyminen}; });
  var cells = [];
  for(var hh=T0; hh<T1; hh++){
    var mitatut = pts.filter(function(p){ return p.h >= hh && p.h < hh+1; });
    var v = null, sillat = false;
    if(mitatut.length){ v = mean(mitatut.map(function(p){return p.v;})); }
    else{
      var ennen = null, jalkeen = null;
      pts.forEach(function(p){ if(p.h < hh+0.5 && (!ennen || p.h > ennen.h)) ennen = p; });
      pts.forEach(function(p){ if(p.h >= hh+0.5 && (!jalkeen || p.h < jalkeen.h)) jalkeen = p; });
      if(ennen && jalkeen && (jalkeen.h - ennen.h) <= 3){
        v = ennen.v + (hh+0.5 - ennen.h)/(jalkeen.h - ennen.h)*(jalkeen.v - ennen.v); sillat = true;
      }
    }
    if(v == null) continue;
    cells.push({ l:((hh-T0)/SPAN*100), w:(100/SPAN - 0.5), v:v, sillat:sillat });
  }
  var doses = d.doses.filter(function(x){ return x.status==="otettu"; })
                     .map(function(x){ return ((wallHours(x.at)-T0)/SPAN*100); })
                     .filter(function(l){ return l >= 0 && l <= 100; });
  return { cells:cells, doses:doses };
}
function miniBandHtml(d, korkeus){
  var H = korkeus || 14;
  var s = paivaSolut(d);
  var h = ['<span class="mband" style="height:'+H+'px" aria-hidden="true">'];
  h.push('<span class="mb-18"></span>');
  s.cells.forEach(function(c){
    var ch = c.sillat ? Math.round(H*0.57) : H, ct = c.sillat ? Math.round((H-ch)/2) : 0;
    h.push('<span class="mb-c" style="left:'+c.l.toFixed(2)+'%;width:'+c.w.toFixed(2)+'%;top:'+ct+'px;height:'+ch+'px;background:'+rampColor(c.v)+'"></span>');
  });
  s.doses.forEach(function(l){ h.push('<span class="mb-d" style="left:'+l.toFixed(2)+'%"></span>'); });
  if(d.liikaa) h.push('<span class="mb-liikaa"></span>');
  h.push('</span>');
  return h.join("");
}

/* Raportin päiväraita: jokainen kalenteripäivä jaksolla, minikaista + haitat + uni. */
function raporttiRaita(paivat){
  var byKey = {}; paivat.forEach(function(p){ byKey[p.key] = p; });
  var alku = paivat[0].key, loppu = paivat[paivat.length-1].key;
  var h = ['<div class="rp-axis"><span style="width:44px"></span><span style="width:24px;text-align:right;font-weight:700">mg</span>'
    +'<span class="mband" style="height:12px"><span style="position:absolute;left:0">7</span><span style="position:absolute;left:20%">10</span><span style="position:absolute;left:40%">13</span><span style="position:absolute;left:60%">16</span><span style="position:absolute;left:73.3%;font-weight:700">klo 18</span><span style="position:absolute;right:0">22</span></span>'
    +'<span style="width:34px"></span></div>'];
  h.push('<div class="rp-strip">');
  var n = 0;
  for(var k = alku; k <= loppu && n < 70; k = addDays(k,1), n++){
    var p = byKey[k];
    var wd = keyToDate(k).getDay();
    var mt = (wd===1 && k!==alku) ? ' style="margin-top:8px"' : '';
    h.push('<div class="rp-row"'+mt+'>');
    h.push('<span class="rp-d">'+esc(fmtDateShort(k))+'</span>');
    h.push('<span class="rp-mg">'+(p && p.aamuMg!=null ? p.aamuMg : "")+'</span>');
    if(p){
      h.push(miniBandHtml(p, 15));
      var dots = ''; for(var i=0;i<Math.min(6,p.haitat.length);i++) dots += '<span class="rp-se"></span>';
      var sleepH = p.sleep && p.sleep.laatu ? Math.round(p.sleep.laatu*2.6) : 0;
      h.push('<span class="rp-right"><span style="display:flex;gap:2px;flex:1">'+dots+'</span><span class="rp-sleep" style="height:'+sleepH+'px"></span></span>');
    }else{
      h.push('<span class="mband" style="height:15px"><span class="mb-18"></span></span><span class="rp-right"></span>');
    }
    h.push('</div>');
  }
  h.push('</div>');
  if(daysBetween(alku, loppu) + 1 > 70) h.push('<p class="hint">Raita näyttää jakson 70 ensimmäistä päivää.</p>');
  return h.join("");
}

/* --- B. Päiväraita: rivi = päivä, sarake = tunti --- */
function osioPaivaraita(){
  var st = kerayTilastot();
  var paivat = st.paivat.slice().reverse().slice(0, 42);
  if(!paivat.length) return "";
  var W = 334, GUT = 66, RIGHT = 46, T0 = 7, T1 = 22, RH = 22, AXIS_GAP = 12;
  var bandX = GUT, bandW = W - GUT - RIGHT - 8;
  var col = bandW / (T1 - T0);
  function X(hh){ return bandX + (hh - T0) * col; }
  /* tuntiakseli toistuu 7 rivin välein; jokainen toisto varaa oman tilansa,
     jotta se ei osu edellisen rivin päälle */
  function rowY(ri){ return 16 + ri*RH + Math.floor(ri/7)*AXIS_GAP; }
  var H = rowY(paivat.length) + 10;
  var s = [];

  s.push('<line x1="'+X(18).toFixed(1)+'" y1="10" x2="'+X(18).toFixed(1)+'" y2="'+(H-8)+'" stroke="var(--rule-strong)" stroke-width="1"/>');

  paivat.forEach(function(d, ri){
    var y = rowY(ri);
    var yCell = y + 4, cellH = 15;
    s.push('<line x1="'+bandX+'" y1="'+(yCell+cellH/2)+'" x2="'+(bandX+bandW)+'" y2="'+(yCell+cellH/2)+'" stroke="var(--grid)" stroke-width="1"/>');

    /* mitatut ja silloitetut tunnit */
    var pts = d.checkins.filter(function(c){ return c.scores && c.scores.keskittyminen!=null; })
                        .map(function(c){ return {h:wallHours(c.at), v:c.scores.keskittyminen}; });
    for(var hh=T0; hh<T1; hh++){
      var mitatut = pts.filter(function(p){ return p.h >= hh && p.h < hh+1; });
      var v = null, sillat = false;
      if(mitatut.length){ v = mean(mitatut.map(function(p){return p.v;})); }
      else{
        var ennen = null, jalkeen = null;
        pts.forEach(function(p){ if(p.h < hh+0.5 && (!ennen || p.h > ennen.h)) ennen = p; });
        pts.forEach(function(p){ if(p.h >= hh+0.5 && (!jalkeen || p.h < jalkeen.h)) jalkeen = p; });
        if(ennen && jalkeen && (jalkeen.h - ennen.h) <= 3){
          var f = (hh+0.5 - ennen.h) / (jalkeen.h - ennen.h);
          v = ennen.v + f*(jalkeen.v - ennen.v); sillat = true;
        }
      }
      if(v == null) continue;
      var hgt = sillat ? 8 : cellH;
      var yy = sillat ? yCell + (cellH-8)/2 : yCell;
      s.push('<rect x="'+(X(hh)+1).toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+Math.max(1,col-2).toFixed(1)+'" height="'+hgt+'" fill="'+rampColor(v)+'"/>');
    }
    /* annosmerkit */
    d.doses.forEach(function(x){
      if(x.status !== "otettu") return;
      s.push('<rect x="'+(X(wallHours(x.at))-1).toFixed(1)+'" y="'+y+'" width="2" height="4" fill="var(--text)"/>');
    });
    /* liikaa-merkki */
    if(d.liikaa) s.push('<path d="M'+(bandX-7)+' '+(yCell+2)+' l5 0 l-2.5 5 z" fill="var(--text)"/>');
    /* kouru: päivämäärä vasemmalla, aamuannos tekstinä oikeassa reunassa (ei väriä - sininen on jo teholla) */
    s.push('<text x="0" y="'+(yCell+11)+'" font-size="10" fill="var(--text-2)">'+esc(fmtDateShort(d.key))+'</text>');
    s.push('<text x="'+(GUT-9)+'" y="'+(yCell+11)+'" text-anchor="end" font-size="10" font-weight="700" fill="var(--text)">'+(d.aamuMg!=null?d.aamuMg:"–")+'</text>');
    /* haittapisteet */
    var nh = Math.min(6, d.haitat.length);
    for(var i=0;i<nh;i++){
      var cx = W - RIGHT + 4 + (i%3)*7, cy = yCell + 4 + Math.floor(i/3)*7;
      s.push('<circle cx="'+cx+'" cy="'+cy+'" r="2.5" fill="var(--text)" opacity=".85"/>');
    }
    /* unipalkki */
    if(d.sleep && d.sleep.laatu){
      var hgt2 = d.sleep.laatu*3;
      s.push('<rect x="'+(W-12)+'" y="'+(yCell+cellH-hgt2)+'" width="10" height="'+hgt2+'" fill="var(--text-2)" opacity=".5"/>');
    }
    /* tuntiakseli 7 rivin välein, omassa tilassaan rivin yläpuolella */
    if(ri % 7 === 0){
      for(var t=T0;t<=21;t+=2) s.push('<text x="'+X(t).toFixed(1)+'" y="'+(y-5)+'" text-anchor="middle" font-size="8" fill="var(--text-3)">'+t+'</text>');
    }
  });

  return '<h2 class="sec">Päivät yksitellen</h2>'
    +'<p class="hint" style="margin:-4px 0 8px">Rivi on päivä, sarake tunti. Tummempi = parempi keskittyminen. Uusin ylimpänä.</p>'
    +'<div class="card tight"><svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Päivittäinen keskittyminen tunneittain, '+paivat.length+' päivää">'+s.join("")+'</svg>'
    +'<div class="legend"><span class="k"><span class="sq" style="background:var(--r5)"></span>kirjattu, korkea</span>'
    +'<span class="k"><span class="sq" style="background:var(--r2)"></span>kirjattu, matala</span>'
    +'<span class="k"><span class="sq" style="background:var(--r3);height:6px"></span>arvio kirjausten välissä</span>'
    +'<span class="k"><span class="sq" style="background:transparent;border:1px solid var(--border-strong)"></span>ei tietoa</span></div>'
    +'<p class="hint">Vasemmalla aamuannos milligrammoina. Oikealla pisteet = päivän haittamerkinnät, harmaa palkki = unen laatu. Kolmio rivin alussa: jokin merkki liiasta annoksesta. Pystyviiva on klo 18.</p>'
    +'<p class="hint">Ennen ensimmäistä ja viimeisen kirjauksen jälkeen ei väritetä mitään — sovellus ei arvaa sitä, mitä se yrittää mitata.</p></div>';
}

/* --- Riittikö teho klo 18:aan --- */
function osioKesto(){
  var st = kerayTilastot();
  var kaikkiTyot = st.paivat.filter(function(d){ return d.tyyppi==="tyo"; });
  var tyot = kaikkiTyot.filter(function(d){ return d.aamu; });
  var ilmanAamuannosta = kaikkiTyot.length - tyot.length;
  if(!tyot.length) return "";
  var h = ['<h2 class="sec">Riittikö vaikutus klo 18 asti?</h2>'];

  var kelpo = 0, riitti = 0, eiTietoa = 0;
  tyot.forEach(function(d){
    var ip = d.checkins.filter(function(c){ var hh=wallHours(c.at); return hh>=16 && hh<19 && c.scores && c.scores.keskittyminen!=null; });
    if(!ip.length){ eiTietoa++; return; }
    kelpo++;
    var lahin = ip[0], best = Math.abs(wallHours(ip[0].at)-17);
    ip.forEach(function(c){ var dd = Math.abs(wallHours(c.at)-17); if(dd<best){best=dd;lahin=c;} });
    if(lahin.scores.keskittyminen >= 3) riitti++;
  });

  if(kelpo === 0 || eiTietoa >= tyot.length*0.5){
    h.push('<div class="gate"><span class="ttl">'+(kelpo===0
        ? 'Yhdeltäkään työpäivältä ei ole vielä klo 16–19 kirjausta.'
        : 'Klo 16–19 kirjauksia on vain '+nTyopaivalta(kelpo)+'.')+'</span>'
      +'Kestosta ei voi vielä sanoa mitään. Iltapäivän kirjaus on tämän päiväkirjan tärkein hetki — ilman sitä luku kertoisi vain niistä päivistä, jotka jaksoit kirjata.</div>');
  }else{
    h.push('<div class="card"><div style="font-size:1rem;line-height:1.55">'
      +'Työpäivistä, joilta on klo 16–19 kirjaus: vaikutus oli vielä riittävä (vähintään 3) <b>'+riitti+' päivänä '+kelpo+':stä</b>.'
      +'</div><p class="hint" style="margin-top:8px">'+(eiTietoa===0
        ? 'Kaikilta työpäiviltä löytyy klo 16–19 kirjaus.'
        : 'Lisäksi '+nTyopaivalta(eiTietoa)+' puuttuu klo 16–19 kirjaus.')
      +(ilmanAamuannosta ? ' Vertailun ulkopuolella on lisäksi '+nTyopaivalta(ilmanAamuannosta)+', joilta aamuannosta ei ole kirjattu tai se jäi ottamatta.' : '')
      +' Yhtään päivää ei jätetä hiljaa pois.</p></div>');
  }

  /* päättymisaikojen jakauma */
  var rivit = tyot.map(function(d){ return {d:d, p:paattyminen(d)}; })
                  .filter(function(r){ return ["arvio","kirjattu","jatkui-viela","vali"].indexOf(r.p.tila) >= 0; });
  if(rivit.length >= 3){
    var W=334, H=86, L=10, R=10;
    /* akseli klo 9-22: aiempi 11:n alaraja pakkasi kaikki lyhyet paivat
       vasempaan reunaan ja sai ne nayttamaan pidemmilta kuin olivat */
    function X(hh){ return L + (Math.max(9,Math.min(22,hh))-9)/(22-9)*(W-L-R); }
    var s = [];
    [10,12,14,16,18,20,22].forEach(function(t){
      s.push('<line x1="'+X(t).toFixed(1)+'" y1="8" x2="'+X(t).toFixed(1)+'" y2="'+(H-18)+'" stroke="'+(t===18?"var(--rule-strong)":"var(--grid)")+'" stroke-width="1"/>');
      s.push('<text x="'+X(t).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" font-size="10" fill="var(--text-3)">'+t+'</text>');
    });
    rivit.forEach(function(r, i){
      var y = 16 + (i%6)*10;
      var vari = r.d.aamuMg!=null ? ryhmaVarit(r.d.aamuMg) : "var(--text-3)";
      if(r.p.tila === "jatkui-viela"){
        var x = X(r.p.viimeinen);
        s.push('<circle cx="'+x.toFixed(1)+'" cy="'+y+'" r="4" fill="'+vari+'" stroke="var(--surface)" stroke-width="2"/>');
        s.push('<line x1="'+x.toFixed(1)+'" y1="'+y+'" x2="'+(x+12).toFixed(1)+'" y2="'+y+'" stroke="'+vari+'" stroke-width="1.5"/>');
        s.push('<path d="M'+(x+12).toFixed(1)+' '+(y-3)+' l4 3 l-4 3 z" fill="'+vari+'"/>');
      }else if(r.p.tila === "vali"){
        s.push('<line x1="'+X(r.p.alku).toFixed(1)+'" y1="'+y+'" x2="'+X(r.p.loppu).toFixed(1)+'" y2="'+y+'" stroke="'+vari+'" stroke-width="2"/>');
        s.push('<circle cx="'+X(r.p.alku).toFixed(1)+'" cy="'+y+'" r="3" fill="var(--surface)" stroke="'+vari+'" stroke-width="1.5"/>');
        s.push('<circle cx="'+X(r.p.loppu).toFixed(1)+'" cy="'+y+'" r="3" fill="var(--surface)" stroke="'+vari+'" stroke-width="1.5"/>');
      }else{
        if(+r.d.aamuMg === 36)
          s.push('<rect x="'+(X(r.p.klo)-3.6).toFixed(1)+'" y="'+(y-3.6)+'" width="7.2" height="7.2" transform="rotate(45 '+X(r.p.klo).toFixed(1)+' '+y+')" fill="'+vari+'" stroke="var(--surface)" stroke-width="2"/>');
        else
          s.push('<circle cx="'+X(r.p.klo).toFixed(1)+'" cy="'+y+'" r="4" fill="'+vari+'" stroke="var(--surface)" stroke-width="2"/>');
      }
    });
    h.push('<div class="card tight" style="margin-top:12px">'
      +'<div style="font-size:.8125rem;font-weight:600;margin-bottom:2px">Milloin vaikutus loppui</div>'
      +'<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Vaikutuksen päättymisajat päivittäin">'+s.join("")+'</svg>'
      +'<div class="legend"><span class="k"><span class="sq" style="background:var(--dose-18);border-radius:50%"></span>18 mg aamulla (ympyrä)</span>'
      +'<span class="k"><span class="sq" style="background:var(--dose-36);transform:rotate(45deg)"></span>36 mg aamulla (vinoneliö)</span>'
      +'<span class="k">▸ = jatkui vielä viimeisen kirjauksen jälkeen</span></div>'
      +'<p class="hint">Keskilukua ei näytetä: osana päivistä vaikutus jatkui vielä viimeisen kirjauksen jälkeen, joten keskiluku aliarvioisi keston.</p></div>');
  }

  /* päiväkohtainen lista */
  var lista = tyot.slice().reverse().slice(0,10);
  h.push('<details class="disc"><summary>Päivä päivältä</summary><div class="dbody"><div class="rows" style="border-top:0">');
  lista.forEach(function(d){
    h.push('<div class="row"><span class="t" style="flex:0 0 58px">'+esc(fmtDateShort(d.key))+'</span>'
      +'<span class="m"><span class="p" style="font-size:.875rem">'+esc(paattymisTeksti(paattyminen(d)))+'</span>'
      +'<span class="s">'+(d.aamuMg!=null?("aamu "+d.aamuMg+" mg"):"ei aamuannosta")+(d.lounas?(" · lounas klo "+fmtTime(d.lounas.at)):" · ei lounasannosta")+'</span></span></div>');
  });
  h.push('</div></div></details>');
  return h.join("");
}

/* --- Auttoiko lääke? --- */
function osioHyotyHaitta(){
  var st = kerayTilastot();
  if(st.paiviaKirjattu < 5) return "";
  var wraps = st.paivat.filter(function(d){ return d.wrapup && d.wrapup.kesti; });
  var eiVaikutusta = wraps.filter(function(d){ return d.wrapup.kesti === "eivaikutusta"; }).length;
  var lk = st.paivat.filter(function(d){ return d.wrapup && d.wrapup.paiva!=null; });
  var kaPaiva = mean(lk.map(function(d){ return d.wrapup.paiva; }));
  var haittaPaivia = st.paivat.filter(function(d){ return d.haitat.length > 0; }).length;
  var eiHaittoja = st.paivat.filter(function(d){ return d.eiHaittoja; }).length;
  var liikaaPaivia = st.paivat.filter(function(d){ return d.liikaa; }).length;

  var h = ['<h2 class="sec">Auttoiko lääke?</h2>'];
  h.push('<div class="card"><table class="data"><tbody>');
  h.push('<tr><td>Päiviä kirjattu</td><td>'+st.paiviaKirjattu+'</td></tr>');
  if(lk.length) h.push('<tr><td>Päivä kokonaisuutena, keskiarvo</td><td>'+num1(kaPaiva)+' <em>('+lk.length+' pv)</em></td></tr>');
  h.push('<tr><td>Päiviä, joille on merkitty haittoja</td><td>'+haittaPaivia+'</td></tr>');
  h.push('<tr><td>Päiviä, joille on merkitty ”ei haittoja”</td><td>'+eiHaittoja+'</td></tr>');
  h.push('<tr><td>Päiviä, joilla on merkki liiasta annoksesta</td><td>'+liikaaPaivia+'</td></tr>');
  if(wraps.length) h.push('<tr><td>Päiviä, joina et huomannut vaikutusta</td><td>'+eiVaikutusta+' <em>('+wraps.length+' vastausta)</em></td></tr>');
  h.push('</tbody></table>');
  h.push('<p class="hint" style="margin-top:10px">Nämä ovat laskureita, eivät pisteytys. Sovellus ei laske hyödyn ja haitan erotusta, koska se painottaisi ne puolestasi.</p></div>');
  return h.join("");
}

/* --- Haitat ajassa --- */
function osioHaitatAjassa(){
  var st = kerayTilastot();
  var laskuri = {}, ajat = {};
  st.paivat.forEach(function(d){
    var nahdyt = {};
    d.haitat.forEach(function(x){
      if(!nahdyt[x.id]){ laskuri[x.id] = (laskuri[x.id]||0)+1; nahdyt[x.id]=1; }
      var hh = wallHours(x.at);
      var k = hh<11?"aamu":hh<14?"keskipäivä":hh<18?"iltapäivä":"ilta";
      ajat[x.id] = ajat[x.id] || {};
      ajat[x.id][k] = (ajat[x.id][k]||0)+1;
    });
  });
  var ids = Object.keys(laskuri).sort(function(a,b){ return laskuri[b]-laskuri[a]; });
  if(!ids.length) return "";
  var h = ['<h2 class="sec">Haittavaikutukset</h2>'];
  h.push('<div class="scrollx"><table class="data"><thead><tr><th>Oire</th><th>Päiviä</th><th>Osuus</th><th>Kirjattu</th></tr></thead><tbody>');
  ids.forEach(function(id){
    var d0 = seById(id) || (STORE.settings.omat.filter(function(o){return o.id===id;})[0]) || {n:id};
    var a = ajat[id]||{}, paras = null, pn = 0;
    for(var k in a) if(a[k] > pn){ pn = a[k]; paras = k; }
    h.push('<tr><td>'+esc(d0.n)+'</td><td>'+laskuri[id]+'</td><td>'+Math.round(laskuri[id]/st.paiviaKirjattu*100)+' %</td><td>'+esc(paras||"–")+'</td></tr>');
  });
  h.push('</tbody></table></div>');
  h.push('<p class="hint">Osuus lasketaan kirjatuista päivistä ('+st.paiviaKirjattu+'). Sarake ”Kirjattu” kertoo, mihin aikaan merkintä tehtiin — ei sitä, milloin oire alkoi.</p>');
  return h.join("");
}

var RAPORTTI_PAIVIA = 30;

function renderReport(){
  el("topTitle").textContent = "Raportti"; el("topDate").textContent = ""; el("subline").hidden = true;
  var h = [];
  h.push('<div class="noprint">');
  h.push('<h2 class="sec">Yhteenveto lääkärille</h2>');
  h.push('<div class="chipwrap" style="margin-bottom:12px">');
  [[14,"14 pv"],[30,"30 pv"],[90,"90 pv"],[9999,"Kaikki"]].forEach(function(p){
    h.push('<button class="chip" type="button" aria-pressed="'+(RAPORTTI_PAIVIA===p[0]?"true":"false")+'" data-range="'+p[0]+'">'+p[1]+'</button>');
  });

    +'<button class="btn btn-primary" type="button" data-print="1">Tulosta</button>'

function raportinPaivat(){
  var st = kerayTilastot();
  if(RAPORTTI_PAIVIA >= 9999) return st.paivat;
  var raja = addDays(todayKey(), -(RAPORTTI_PAIVIA-1));
  return st.paivat.filter(function(d){ return d.key >= raja; });
}

function reportHtml(){
  var paivat = raportinPaivat();
  var h = [];
  if(!paivat.length) return '<div class="empty">Ei merkintöjä valitulla ajanjaksolla.</div>';

  var alku = paivat[0].key, loppu = paivat[paivat.length-1].key;
  var span = daysBetween(alku, loppu) + 1;

  var jk = jaksoFor(loppu);
  var valm = jk.annokset.map(function(a){
    var v = slotValmiste(a);
    return a.nimi.toLowerCase()+": "+(v ? valmisteNimi(v, true) : "valmistetta ei ole merkitty asetuksiin");
  });
  var samat = jk.annokset.every(function(a){ return slotValmiste(a) && slotValmiste(a) === slotValmiste(jk.annokset[0]); });
  var laakeRivi = "metyylifenidaatti · "+(samat ? valmisteNimi(slotValmiste(jk.annokset[0]), true) : valm.join(" · "));
  var tyotEnnakko = paivat.filter(function(d){ return d.tyyppi==="tyo"; }).length;

  /* viikkojaksot: kunkin ISO-viikon vallitseva aamuannos */
  var viikot = {};
  paivat.forEach(function(d){
    if(d.aamuMg == null) return;
    var dt = keyToDate(d.key); var t = new Date(dt); t.setHours(0,0,0,0);
    t.setDate(t.getDate() + 3 - ((t.getDay()+6)%7));
    var w1 = new Date(t.getFullYear(),0,4);
    var vk = 1 + Math.round(((t - w1)/86400000 - 3 + ((w1.getDay()+6)%7))/7);
    viikot[vk] = viikot[vk] || {}; viikot[vk][d.aamuMg] = (viikot[vk][d.aamuMg]||0)+1;
  });
  var jaksot = Object.keys(viikot).map(Number).sort(function(a,b){return a-b;}).map(function(vk){
    var o = viikot[vk], best = null, bn = 0, total = 0;
    Object.keys(o).forEach(function(m){ total += o[m]; if(o[m] > bn){ bn = o[m]; best = m; } });
    return "vk "+vk+": "+best+" mg"+(bn < total ? " ("+bn+"/"+total+")" : "");
  }).join(" · ");

  h.push('<div class="card"><div class="rp-head">'
    +'<div><div class="rp-title">Titraus · annospäiväkirja</div>'
    +'<div class="rp-sub">'+esc(laakeRivi)+' · potilaan oma kirjanpito</div></div>'
    +'<div class="rp-meta">Jakso <b>'+esc(fmtDateShort(alku)+" – "+fmtDateNum(loppu))+'</b> · '+paivat.length+' / '+span+' päivää kirjattu · '+tyotEnnakko+' työpäivää<br>'
    +'Tulostettu '+esc(fmtDateNum(todayKey()))+' · tiedot vain potilaan laitteella</div></div>');
  h.push('<div class="rp-cols">'
    +'<div><b>Lääkärin ohje</b><br>'+esc(ohjeRivi(jk))+'</div>'
    +'<div><b>Kirjaustapa</b><br>Keskittyminen 1–5 pitkin päivää, haitat ja uni erikseen. Puuttuvaa ei täytetä.</div>'
    +'<div><b>Jaksot</b><br>'+esc(jaksot || "ei aamuannoksia kirjattuna")+'</div></div>');

  /* 2. toteutunut lääkitys */
  var jako = {};
  paivat.forEach(function(d){ if(d.aamuMg!=null) jako[d.aamuMg] = (jako[d.aamuMg]||0)+1; });
  var aamuAjat = paivat.filter(function(d){return d.aamu;}).map(function(d){ return wallHours(d.aamu.at); });
  var lounasAjat = paivat.filter(function(d){return d.lounas;}).map(function(d){ return wallHours(d.lounas.at); });
  var tyot = paivat.filter(function(d){ return d.tyyppi==="tyo"; });
  var puuttuvat = 0, ohitetut = 0;
  tyot.forEach(function(d){
    suunnitellut(d.key).forEach(function(sl){
      var x = doseOfSlot(d.key, sl.slot);
      if(!x) puuttuvat++; else if(x.status === "valiin") ohitetut++;
    });
  });
  h.push('<div class="rh">1 · Toteutunut lääkitys</div><div class="scrollx"><table class="data"><tbody>');
  h.push('<tr><td>Aamuannos</td><td>'+esc(Object.keys(jako).map(function(m){ return m+" mg: "+jako[m]+" pv"; }).join(" · ")||"–")+'</td></tr>');
  h.push('<tr><td>Aamuannoksen mediaaniaika</td><td>'+(aamuAjat.length?("klo "+fmtHoursClock(median(aamuAjat))):"–")+'</td></tr>');
  h.push('<tr><td>Lounasannos</td><td>'+(lounasAjat.length?(lounasAjat.length+" pv · mediaani klo "+fmtHoursClock(median(lounasAjat))):"–")+'</td></tr>');
  h.push('<tr><td>Työpäiviä jaksolla</td><td>'+tyot.length+'</td></tr>');
  h.push('<tr><td>Annoksia kirjaamatta / merkitty ottamatta</td><td>'+puuttuvat+' / '+ohitetut+'</td></tr>');
  h.push('</tbody></table></div>');

  /* 3. vertailu */
  var g = {};
  tyot.forEach(function(d){ if(d.aamuMg!=null) (g[d.aamuMg]=g[d.aamuMg]||[]).push(d); });
  var mgs = Object.keys(g).map(Number).sort(function(a,b){return a-b;});
  h.push('<div class="rh">2 · Aamuannokset rinnakkain</div>');
  var mgsOk = mgs.filter(function(m){ return g[m].length >= 3; });
  if(mgsOk.length >= 2){
    /* varaus ENNEN taulukkoa - sen jälkeen luettu varaus tulee liian myöhään */
    h.push('<p class="rp-caveat">Perustuu '+esc(mgsOk.map(function(m){ return nPaivaan(g[m].length)+" "+m+" mg:lla"; }).join(" ja "))
      +(mgsOk.some(function(m){ return g[m].length < 5; }) ? ' — liian vähän varmoihin johtopäätöksiin.' : '.')
      +' Luvut ovat potilaan omia arvioita; mitään ei korosteta eikä paremmuutta merkitä. Vain työpäivät.</p>');
    h.push(tukiluvut(g, mgsOk));
  }else{
    h.push('<p class="hint">Vertailua ei esitetä: molemmilla annoksilla ei ole vielä vähintään kolmea kirjattua työpäivää ('
      +esc(mgs.map(function(m){return m+" mg: "+nPaivaa(g[m].length);}).join(" · ")||"ei aamuannoksia kirjattuna")+').</p>');
  }

  /* 4. kesto */
  var kelpo=0, riitti=0, eiTietoa=0;
  tyot.filter(function(d){return d.aamu;}).forEach(function(d){
    var ip = d.checkins.filter(function(c){ var hh=wallHours(c.at); return hh>=16&&hh<19&&c.scores&&c.scores.keskittyminen!=null; });
    if(!ip.length){ eiTietoa++; return; }
    kelpo++;
    var lahin = ip[0], best = Math.abs(wallHours(ip[0].at)-17);
    ip.forEach(function(c){ var dd=Math.abs(wallHours(c.at)-17); if(dd<best){best=dd;lahin=c;} });
    if(lahin.scores.keskittyminen>=3) riitti++;
  });
  h.push('<div class="rh">3 · Päiväraita — kaikki päivät klo 7–22</div>');
  h.push('<p class="rp-caveat">Rivi = päivä. Sininen = keskittyminen (tummempi parempi), kapea palkki = arvio kirjausten välistä. Pykälä = otettu annos, numero = aamuannos mg, kolmio = ”liikaa”-merkki, pisteet = haittamerkinnät, oikean reunan palkki = unen laatu. Tyhjä kohta = ei kirjauksia.</p>');
  h.push(raporttiRaita(paivat));

  h.push('<div class="rh">4 · Vaikutuksen kesto</div>');
  var tyotAamulla = tyot.filter(function(d){ return d.aamu; }).length;
  if(kelpo === 0 || eiTietoa >= tyotAamulla*0.5){
    /* sama kattavuusportti kuin TRENDIT-nakymassa: ilman sita luku kertoisi
       vain niista paivista, jotka jaksettiin kirjata */
    h.push('<p style="font-size:.875rem;line-height:1.6;margin:0">Klo 16–19 kirjauksia on '
      +esc(nTyopaivalta(kelpo))+' '+tyotAamulla+':stä. Kestosta ei voi näiden perusteella sanoa mitään, joten suhdelukua ei esitetä.</p>');
  }else{
  h.push('<p style="font-size:.875rem;line-height:1.6;margin:0">Työpäivistä, joilta on klo 16–19 kirjaus: vaikutus oli vielä riittävä (vähintään 3/5) <b>'+riitti+' päivänä '+kelpo+':stä</b>. '+(eiTietoa===0 ? 'Kaikilta työpäiviltä löytyy iltapäivän kirjaus.' : 'Lisäksi '+nTyopaivalta(eiTietoa)+' puuttuu iltapäivän kirjaus.')+'</p>');
  }
  var kestot = {};
  paivat.forEach(function(d){ if(d.wrapup && d.wrapup.kesti) kestot[d.wrapup.kesti] = (kestot[d.wrapup.kesti]||0)+1; });
  if(Object.keys(kestot).length){
    h.push('<p style="font-size:.875rem;margin:8px 0 0">Oma arvio kestosta: '
      +esc(Object.keys(kestot).map(function(k){ return kestiNimi(k)+" "+kestot[k]+" pv"; }).join(" · "))+'</p>');
  }

  /* 5. haitat */
  var laskuri = {}, ajat = {};
  paivat.forEach(function(d){
    var nahdyt = {};
    d.haitat.forEach(function(x){
      if(!nahdyt[x.id]){ laskuri[x.id]=(laskuri[x.id]||0)+1; nahdyt[x.id]=1; }
      var hh = wallHours(x.at), k = hh<11?"aamu":hh<14?"keskipäivä":hh<18?"iltapäivä":"ilta";
      ajat[x.id] = ajat[x.id]||{}; ajat[x.id][k] = (ajat[x.id][k]||0)+1;
    });
  });
  var ids = Object.keys(laskuri).sort(function(a,b){ return laskuri[b]-laskuri[a]; });
  h.push('<div class="rh">5 · Haittavaikutukset jaksolla</div>');
  if(ids.length){
    /* proosayhteenveto: yleisimmät, jaettuna aamuannoksen mukaan kun molempia on */
    var kaksi = mgs.length >= 2;
    var proosa = ids.slice(0,4).map(function(id){
      var d0 = seById(id) || (STORE.settings.omat.filter(function(o){return o.id===id;})[0]) || {n:id};
      var t = d0.n+" "+laskuri[id]+" pv";
      if(kaksi){
        var per = {}; paivat.forEach(function(d){ if(d.aamuMg!=null && d.haitat.some(function(x){return x.id===id;})) per[d.aamuMg]=(per[d.aamuMg]||0)+1; });
        var osat = mgs.map(function(m){ return m+" mg "+(per[m]||0)+"/"+g[m].length; });
        t += " ("+osat.join(", ")+")";
      }
      return t;
    }).join(" · ");
    var liikaaPv = paivat.filter(function(d){ return d.liikaa; });
    h.push('<p class="rp-prose">'+esc(proosa)+'.'
      +(liikaaPv.length ? '<br><span style="color:var(--text-2)">”Liikaa”-merkkejä '+liikaaPv.length+' pv: '+esc(liikaaPv.slice(0,5).map(function(d){ return fmtDateShort(d.key)+(d.aamuMg!=null?" ("+d.aamuMg+" mg)":""); }).join(", "))+(liikaaPv.length>5?" …":"")+'.</span>' : '')
      +'</p>');
    h.push('<div class="scrollx"><table class="data"><thead><tr><th>Oire</th><th>Päiviä</th><th>Osuus</th><th>Kirjattu</th><th>SPC</th></tr></thead><tbody>');
    ids.forEach(function(id){
      var d0 = seById(id) || (STORE.settings.omat.filter(function(o){return o.id===id;})[0]) || {n:id, f:""};
      var a = ajat[id]||{}, paras=null, pn=0;
      for(var k in a) if(a[k]>pn){pn=a[k];paras=k;}
      h.push('<tr><td>'+esc(d0.n)+'</td><td>'+laskuri[id]+'</td><td>'+Math.round(laskuri[id]/paivat.length*100)+' %</td><td>'+esc(paras||"–")+'</td><td style="font-size:.75rem;color:var(--text-3)">'+esc(d0.f||"")+'</td></tr>');
    });
    h.push('</tbody></table></div>');
  }else{
    h.push('<p style="font-size:.875rem;margin:0">Ei kirjattuja haittavaikutuksia.</p>');
  }
  h.push('<p class="hint">Muita listan oireita ei kirjattu. Päiviä, joille on merkitty erikseen ”ei haittavaikutuksia”: '
    +paivat.filter(function(d){return d.eiHaittoja;}).length+'.</p>');

  /* 6. punaiset liput */
  var rf = [];
  paivat.forEach(function(d){ d.redflags.forEach(function(x){ rf.push({d:d.key, e:x}); }); });
  h.push('<div class="rh">6 · Vakavat oireet</div>');
  if(rf.length){
    h.push('<div class="notice danger">');
    rf.forEach(function(r){ h.push('<div>'+esc(fmtDateNum(r.d)+" klo "+fmtTime(r.e.at)+" — "+r.e.oire+(r.e.taso==="112"?" (112-taso)":""))+'</div>'); });
    h.push('</div>');
  }else{
    h.push('<p style="font-size:.875rem;margin:0">Ei kirjauksia.</p>');
  }

  /* 7. uni */
  var unet = paivat.filter(function(d){ return d.sleep; });
  h.push('<div class="rh">7 · Uni ja ruokahalu</div>');
  if(unet.length){
    var pitkat = unet.filter(function(d){ return d.sleep.nukahtaminen==="m30_60"||d.sleep.nukahtaminen==="yli60"; }).length;

  h.push('</div>');
  return h.join("");
}

function reportText(){
  var tmp = document.createElement("div");
  tmp.innerHTML = reportHtml();
  var rivit = [];
  function walk(n){
    if(n.nodeType === 3){ var t = n.nodeValue.replace(/\s+/g," ").trim(); if(t) rivit.push(t); return; }
    if(n.nodeType !== 1) return;
    var tag = n.tagName;
    if(tag==="TR"){
      var solut = [];
      for(var i=0;i<n.children.length;i++) solut.push(n.children[i].textContent.replace(/\s+/g," ").trim());
      rivit.push(solut.join("  |  ")); return;
    }
    for(var j=0;j<n.childNodes.length;j++) walk(n.childNodes[j]);
    if(tag==="H3"||tag==="P"||tag==="DIV"||tag==="TABLE") rivit.push("");
  }
  walk(tmp);
  var out = [], edellinenTyhja = false;
  rivit.forEach(function(r){
    if(r===""){ if(!edellinenTyhja) out.push(""); edellinenTyhja = true; }
    else{ out.push(r); edellinenTyhja = false; }
  });
  return out.join("\n");
}

/** Leikepoydalle kopiointi ei ole viela varmuuskopio - vasta liittaminen on.
    Siksi se vaimentaa muistutuksen vain lyhyeksi aikaa; tiedostoon tallennus pidemmaksi. */
function merkitseKopioitu(tapa){
  var vk = STORE.settings.varmuuskopio;
  vk.viimeksi = nowIso();
  vk.viimeksiMaara = elavat().length;
  vk.tapa = tapa || "leikepoyta";
  scheduleSave(); flushSave();

function kopioiLeikepoydalle(teksti, onnistui){
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = teksti;
    ta.setAttribute("readonly","");
    ta.style.position = "fixed"; ta.style.top = "-1000px";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, teksti.length);
    var ok = false;
    try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
    document.body.removeChild(ta);
    onnistui(ok);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(teksti).then(function(){ onnistui(true); }, fallback);
  }else fallback();
}
/**
 * Tiedostoon tallennus. Julkaistussa näkymässä sivu ei saa itse käynnistää
 * latausta, joten se kulkee downloads-ominaisuuden kautta ja katsoja
 * vahvistaa sen. Paikallisena tiedostona tavallinen linkki toimii.
 * Nappi ei koskaan valehtele onnistuneensa.
 */
function blobLataus(teksti, nimi, cb){
  try{
    var blob = new Blob([teksti], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = nimi; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    cb(true, "linkki");
  }catch(e){ cb(false, "estetty"); }
}
function yritaLataus(teksti, nimi, cb){
  if(window.claude && typeof window.claude.use === "function"){
    try{
      window.claude.use("downloads").then(function(dl){
        if(!dl){ blobLataus(teksti, nimi, cb); return; }
        dl.save({ filename:nimi, data:teksti }).then(
          function(){ cb(true, "tallennettu"); },
          function(err){ cb(false, (err && err.code) || "unavailable"); }
        );
      }, function(){ blobLataus(teksti, nimi, cb); });
      return;
    }catch(e){ /* pudotaan varareitille */ }
  }
  blobLataus(teksti, nimi, cb);
}

function esikatseleTuonti(teksti){
  var data = tryParse(teksti);
  if(!data || data.app !== "titraus" || !Array.isArray(data.events)){
    alertSheet("Palautus ei onnistu", '<div class="notice danger">Tekstiä ei tunnistettu Titrauksen varmuuskopioksi. Tarkista, että kopioit koko tekstin alkaen merkistä <b>{</b> ja päättyen merkkiin <b>}</b>.</div>');
    return;
  }
  if((data.schemaVersion|0) > SCHEMA){
    alertSheet("Palautus ei onnistu", '<div class="notice danger">Kopio on tehty sovelluksen uudemmalla versiolla (v'+(data.schemaVersion|0)+'). Sitä ei tuoda, jotta tietoa ei menetetä.</div>');
    return;
  }
  var omat = {}; STORE.events.forEach(function(e){ omat[e.id] = e; });
  var uusia = 0, paivittyy = 0, samat = 0;
  data.events.forEach(function(e){
    if(!e || !e.id) return;
    var o = omat[e.id];
    if(!o){ uusia++; return; }
    /* sama vertailu kuin mergeEvents - deletedAt mukana, jotta poisto kulkee läpi */
    if((e.editedAt||e.deletedAt||e.recordedAt||"") > (o.editedAt||o.deletedAt||o.recordedAt||"")) paivittyy++;
    else samat++;
  });
  var h = ['<p style="font-size:.9375rem;line-height:1.6">Kopiossa on '+nKirjausta(data.events.length)+'.</p>'];
  h.push('<div class="scrollx"><table class="data"><tbody>');
  h.push('<tr><td>Uusia kirjauksia</td><td>'+uusia+'</td></tr>');
  h.push('<tr><td>Päivittyy uudempaan</td><td>'+paivittyy+'</td></tr>');
  h.push('<tr><td>Jo olemassa, ei muutosta</td><td>'+samat+'</td></tr>');
  h.push('<tr><td>Nykyisiä kirjauksiasi</td><td>'+STORE.events.length+'</td></tr>');
  h.push('</tbody></table></div>');
  h.push('<p class="hint">Mitään ei poisteta. Nykyinen kirjaus korvataan vain jos kopiossa oleva on uudempi.</p>');
  if(data.settings && data.settings.hoitojaksot){
    h.push('<div class="field"><label style="display:flex;gap:10px;align-items:flex-start;font-size:.875rem;line-height:1.5">'
      +'<input type="checkbox" data-restoresettings="1" checked style="width:auto;min-height:0;margin-top:3px">'
      +'<span>Palauta myös lääkärin määräämät annokset ja työpäivät kopiosta. Ilman tätä suunnitelma jää nykyiseksi.</span></label></div>');
  }
  h.push('<div class="field"><button class="btn btn-primary lg" type="button" data-doimport="1">Palauta '+nKirjausta(uusia+paivittyy)+'</button></div>');
  h.push('<div class="field"><button class="btn btn-quiet" type="button" data-cancel="1">Peruuta</button></div>');
  openSheet({
    title:"Esikatselu", body:h.join(""), focus:false,
    after:function(){
      el("sheetBody").addEventListener("click", function(e){
        if(e.target.closest("[data-cancel]")) { closeSheet(); return; }
        if(!e.target.closest("[data-doimport]")) return;
        data.events.forEach(function(ev2){ if(ev2 && !ev2.source) ev2.source = "import"; });
        var r = mergeEvents(data.events, STORE.events);
        var lisatty = r.lisatty + r.paivitetty;
        var cb = el("sheetBody").querySelector('[data-restoresettings]');
        if(cb && cb.checked && data.settings){
          if(Array.isArray(data.settings.hoitojaksot) && data.settings.hoitojaksot.length)
            STORE.settings.hoitojaksot = data.settings.hoitojaksot;
          if(Array.isArray(data.settings.piilotetut)) STORE.settings.piilotetut = data.settings.piilotetut;
          if(data.settings.dayCutoffHour != null) STORE.settings.dayCutoffHour = data.settings.dayCutoffHour;
        }
        if(data.settings && data.settings.omat) {
          data.settings.omat.forEach(function(x){
            if(!STORE.settings.omat.some(function(y){ return y.id===x.id; })) STORE.settings.omat.push(x);
          });
        }
        scheduleSave(); flushSave(); invalidateTilastot(); invalidateHaittaJarjestys();
        closeSheet();
        setTimeout(function(){ renderAll(); alertSheet("Palautettu", '<p style="font-size:.9375rem">Palautettiin '+nKirjausta(lisatty)+'.</p>'); }, 220);
      });
    }
  });
}

function paivitaJakso(muutos){
  var tanaan = todayKey();
  var js = STORE.settings.hoitojaksot;
  var nykyinen = jaksoFor(tanaan);
  var kohde;
  if(nykyinen.alkaen === tanaan){ kohde = nykyinen; }
  else{
    kohde = JSON.parse(JSON.stringify(nykyinen));
    kohde.alkaen = tanaan;
    js.push(kohde);
    js.sort(function(a,b){ return a.alkaen < b.alkaen ? -1 : 1; });
  }
  muutos(kohde);
  scheduleSave(); invalidateTilastot();
}
