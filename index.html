function setView(v){
  VIEW = v;
  ["today","history","trends","report","settings"].forEach(function(k){
    var s = el("scr-"+k); if(s) s.hidden = (k !== v);
  });
  var napit = document.querySelectorAll("#tabs button");
  for(var i=0;i<napit.length;i++){
    var t = napit[i].getAttribute("data-tab");
    if(t === v) napit[i].setAttribute("aria-current","page"); else napit[i].removeAttribute("aria-current");
  }
  el("dock").hidden = (v !== "today");
  el("subline").hidden = (v !== "today");
  window.scrollTo(0,0);
  renderAll();
}

/** Tallennuksen epäonnistuminen on sovelluksen pahin tila. Se ei saa näyttää
    tavalliselta ilmoitukselta eikä kadota itseään kahdeksassa sekunnissa. */
function renderAlarm(){
  var a = el("alarm");
  if(!_saveFailed){ a.hidden = true; a.innerHTML = ""; return; }
  a.hidden = false;
  a.innerHTML = '<div class="notice danger" style="border-radius:0;border-left:0;border-right:0">'
    +'<span class="ttl">Merkintää ei saatu tallennettua</span>'
    +'Selaimen tallennustila on täynnä tai estetty. Merkintäsi ovat vielä näytöllä, mutta katoavat, jos suljet sovelluksen. Kopioi ne nyt talteen.'
    +'<div style="margin-top:10px"><button class="btn sm btn-quiet" type="button" data-copyjson="1">Kopioi kaikki merkinnät</button></div></div>';
}

function renderAll(){
  invalidateTilastot();
  renderAlarm();
  if(VIEW === "today") renderToday();
  else if(VIEW === "history") renderHistory();
  else if(VIEW === "trends") renderTrends();
  else if(VIEW === "report") renderReport();
  else if(VIEW === "settings") renderSettings();
  el("dock").hidden = (VIEW !== "today");
  el("subline").hidden = (VIEW !== "today");
}

function taytaAnnos(spec){
  var p = spec.split("|");
  var day = p[0], slot = p[1], mg = +p[2];
  var sd = null;
  suunnitellut(day).forEach(function(s){ if(s.slot===slot) sd = s; });
  var at = sd ? plannedIso(day, sd.klo) : plannedIso(day, "07:00");
  addEvent("dose", at, {mg:mg, slot:slot, status:"otettu"}, day);
  renderAll();
}
function ohitaAnnos(spec){
  var p = spec.split("|");
  var day = p[0], slot = p[1];
  var sd = null;
  suunnitellut(day).forEach(function(s){ if(s.slot===slot) sd = s; });
  var at = sd ? plannedIso(day, sd.klo) : plannedIso(day, "07:00");
  addEvent("dose", at, {mg: sd?sd.vaihtoehdot[0]:null, slot:slot, status:"valiin"}, day);
  renderAll();
}

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-tab],[data-log],[data-dose-sheet],[data-checkin],[data-evening],[data-se],[data-se-all],[data-se-none],"
    +"[data-offset-now],[data-open-event],[data-edit-dose],[data-slot],[data-fill],[data-skip],[data-day],[data-go],[data-snooze],"
    +"[data-range],[data-print],[data-copytext],[data-copyjson],[data-download],[data-import],[data-wipe],[data-theme],[data-hide],"
    +"[data-wd],[data-copytimes],[data-sleep],[data-hist-close],[data-hist-evening],[data-hist-dt],[data-hist-add]");
  if(!t) return;
  if(el("sheet").contains(t)) return;

  if(t.hasAttribute("data-tab")){ setView(t.getAttribute("data-tab")); return; }
  if(t.hasAttribute("data-go")){ setView(t.getAttribute("data-go")); return; }

  if(t.hasAttribute("data-log")){
    var p = t.getAttribute("data-log").split("|");
    var e2 = addEvent("dose", nowIso(), {mg:+p[1], slot:p[0], status:"otettu"});
    renderAll();
    showUndo(p[1]+" mg kirjattu klo "+fmtTime(e2.at), e2.id, function(){ openDoseSheet({eventId:e2.id}); });
    return;
  }
  if(t.hasAttribute("data-dose-sheet")){ openDoseSheet({slot:t.getAttribute("data-dose-sheet")}); return; }
  if(t.hasAttribute("data-slot") && !t.hasAttribute("data-edit-dose")){ openDoseSheet({slot:t.getAttribute("data-slot")}); return; }
  if(t.hasAttribute("data-edit-dose")){ openDoseSheet({eventId:t.getAttribute("data-edit-dose")}); return; }
  if(t.hasAttribute("data-checkin")){ openCheckinSheet({}); return; }
  if(t.hasAttribute("data-evening")){ openEveningSheet(todayKey()); return; }
  if(t.hasAttribute("data-se")){ toggleSideEffect(todayKey(), t.getAttribute("data-se")); return; }
  if(t.hasAttribute("data-se-all")){ openSideEffectSheet(todayKey()); return; }
  if(t.hasAttribute("data-se-none")){ eiHaittojaNapista(todayKey()); return; }
  if(t.hasAttribute("data-offset-now")){
    var o = addEvent("offset", nowIso(), {});
    renderAll();
    showUndo("Vaikutuksen loppuminen kirjattu klo "+fmtTime(o.at), o.id, function(){ openOffsetSheet(o.id); });
    return;
  }
  if(t.hasAttribute("data-open-event")){ openEvent(t.getAttribute("data-open-event")); return; }
  if(t.hasAttribute("data-fill")){ taytaAnnos(t.getAttribute("data-fill")); return; }
  if(t.hasAttribute("data-skip")){ ohitaAnnos(t.getAttribute("data-skip")); return; }
  if(t.hasAttribute("data-day")){
    var dk = t.getAttribute("data-day");
    HIST_SEL = (HIST_SEL === dk) ? null : dk;
    renderHistory(); window.scrollTo(0,0); return;
  }
  if(t.hasAttribute("data-hist-close")){ HIST_SEL = null; renderHistory(); return; }
  if(t.hasAttribute("data-hist-evening")){ openEveningSheet(t.getAttribute("data-hist-evening")); return; }
  if(t.hasAttribute("data-hist-dt")){ openDayTypeSheet(t.getAttribute("data-hist-dt")); return; }
  if(t.hasAttribute("data-hist-add")){ openAddMenu(t.getAttribute("data-hist-add")); return; }
  if(t.hasAttribute("data-sleep")){ openSleepSheet(t.getAttribute("data-sleep")); return; }
  if(t.hasAttribute("data-snooze")){
    STORE.settings.varmuuskopio.torkutettu = addDays(todayKey(), 5);
    scheduleSave(); renderAll(); return;
  }
  if(t.hasAttribute("data-range")){ RAPORTTI_PAIVIA = +t.getAttribute("data-range"); renderReport(); return; }
  if(t.hasAttribute("data-print")){ window.print(); return; }
  if(t.hasAttribute("data-copytext")){
    kopioiLeikepoydalle(reportText(), function(ok){ naytaViesti(ok ? "Yhteenveto kopioitu tekstinä." : "Kopiointi ei onnistunut tässä selaimessa."); });
    return;
  }
  if(t.hasAttribute("data-copyjson")){
    kopioiLeikepoydalle(exportJson(), function(ok){
      if(ok) { merkitseKopioitu("leikepoyta"); renderAll(); }
      naytaViesti(ok ? "Kopioitu. Liitä teksti nyt johonkin talteen — vasta silloin se on varmuuskopio." : "Kopiointi ei onnistunut. Avaa ”Näytä varmuuskopion teksti”.");
    });
    return;
  }
  if(t.hasAttribute("data-download")){
    yritaLataus(exportJson(), exportFilename(), function(ok, syy){
      if(ok && syy === "tallennettu"){ merkitseKopioitu("tiedosto"); renderAll(); naytaViesti("Varmuuskopio tallennettu tiedostoon."); return; }
      if(ok){ merkitseKopioitu("tiedosto"); renderAll(); naytaViesti("Lataus käynnistettiin. Tarkista, että tiedosto tuli laitteellesi."); return; }
      if(syy === "declined"){ naytaViesti("Tallennus peruttiin. Merkintöjä ei kopioitu."); return; }
      if(syy === "rate_limited"){ naytaViesti("Odota hetki ja yritä uudelleen."); return; }
      if(syy === "too_large"){ naytaViesti("Merkintöjä on liikaa yhteen tiedostoon. Käytä ”Kopioi leikepöydälle”."); return; }
      naytaViesti("Tiedostoon tallennus ei onnistu tässä näkymässä. Käytä ”Kopioi leikepöydälle”.");
    });
    return;
  }
  if(t.hasAttribute("data-import")){
    var box = el("importBox");
    var v = box ? String(box.value||"").trim() : "";
    if(!v){ naytaViesti("Liitä ensin varmuuskopion teksti kenttään."); return; }
    if(v.length > 20000000){ naytaViesti("Teksti on liian suuri."); return; }
    esikatseleTuonti(v);
    return;
  }
  if(t.hasAttribute("data-wipe")){ vahvistaPoisto(); return; }
  if(t.hasAttribute("data-theme")){
    STORE.settings.teema = t.getAttribute("data-theme");
    kaytaTeema(); scheduleSave(); renderSettings(); return;
  }
  if(t.hasAttribute("data-hide")){
    var id = t.getAttribute("data-hide");
    var i = STORE.settings.piilotetut.indexOf(id);
    if(i >= 0) STORE.settings.piilotetut.splice(i,1); else STORE.settings.piilotetut.push(id);
    scheduleSave(); renderSettings(); return;
  }
  if(t.hasAttribute("data-wd")){
    var wd = +t.getAttribute("data-wd");
    paivitaJakso(function(j){
      var i2 = j.tyopaivat.indexOf(wd);
      if(i2 >= 0) j.tyopaivat.splice(i2,1); else j.tyopaivat.push(wd);
      j.tyopaivat.sort();
    });
    renderSettings(); return;
  }
  if(t.hasAttribute("data-copytimes")){
    var j2 = jaksoFor(todayKey());
    var ajat = j2.annokset.map(function(a){ return a.nimi+" "+a.klo; })
      .concat((j2.voinnit||[]).map(function(v){ return "Vointikirjaus "+v; }))
      .concat(["Iltakirjaus "+(j2.iltakirjaus||"21:00")]);
    kopioiLeikepoydalle(ajat.join("\n"), function(ok){ naytaViesti(ok ? "Ajat kopioitu. Liitä ne puhelimen kelloon." : "Kopiointi ei onnistunut."); });
    return;
  }
});

document.addEventListener("change", function(e){
  var t = e.target;
  if(el("sheet").contains(t)) return;
  if(t.hasAttribute("data-slottime")){
    var i = +t.getAttribute("data-slottime");
    if(!/^\d{1,2}:\d{2}$/.test(String(t.value||""))){ renderSettings(); return; }   /* tyhjä kenttä ei kelpaa */
    paivitaJakso(function(j){
      if(!j.annokset[i]) return;
      j.annokset[i].klo = t.value;
      /* jos uusi aika on ikkunan ulkopuolella, ikkuna ei enää kuvaa ohjetta */
      var ik = j.annokset[i].ikkuna;
      if(ik && (t.value < ik[0] || t.value > ik[1])) j.annokset[i].ikkuna = null;
    });
    renderSettings();
  } else if(t.hasAttribute("data-slotmg")){
    var i2 = +t.getAttribute("data-slotmg");
    var mgs = String(t.value||"").split(/[,;\s]+/).map(Number).filter(function(x){ return isFinite(x) && x>0 && x<=200; });
    if(mgs.length) paivitaJakso(function(j){ if(j.annokset[i2]) j.annokset[i2].vaihtoehdot = mgs; });
    renderSettings();
  } else if(t.hasAttribute("data-slotprep")){
    var i3 = +t.getAttribute("data-slotprep"), v3 = t.value;
    if(!v3){ renderSettings(); return; }
    paivitaJakso(function(j){ if(j.annokset[i3]) j.annokset[i3].valmiste = v3; });
    renderSettings();
  } else if(t.hasAttribute("data-worksend")){
    paivitaJakso(function(j){ j.tyoLoppuu = t.value; }); renderSettings();
  } else if(t.hasAttribute("data-checkins")){
    var ajat = String(t.value||"").split(/[,;\s]+/).filter(function(x){ return /^\d{1,2}:\d{2}$/.test(x); })
      .map(function(x){ var p = x.split(":"); return pad2(+p[0])+":"+pad2(+p[1]); });
    paivitaJakso(function(j){ j.voinnit = ajat; }); renderSettings();
  } else if(t.hasAttribute("data-evetime")){
    paivitaJakso(function(j){ j.iltakirjaus = t.value; }); renderSettings();
  } else if(t.hasAttribute("data-cutoff")){
    var hh = parseInt(String(t.value||"04:00").split(":")[0], 10);
    if(isFinite(hh) && hh>=0 && hh<=8){ STORE.settings.dayCutoffHour = hh; scheduleSave(); invalidateTilastot(); }
    renderSettings();
  }
});

document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && SHEET.avoin){ closeSheet(); return; }
  /* Kohdistusansa: sarkain ei saa karata avoimen levyn taakse olevalle sivulle. */
  if(e.key !== "Tab" || !SHEET.avoin) return;
  var s = el("sheet");
  var f = s.querySelectorAll('button:not([disabled]), a[href], input:not([disabled]), textarea:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])');
  var lista = Array.prototype.filter.call(f, function(n){ return n.offsetParent !== null || n === document.activeElement; });
  if(!lista.length) return;
  var eka = lista[0], vika = lista[lista.length-1];
  if(e.shiftKey && document.activeElement === eka){ vika.focus(); e.preventDefault(); }
  else if(!e.shiftKey && document.activeElement === vika){ eka.focus(); e.preventDefault(); }
  else if(!s.contains(document.activeElement)){ eka.focus(); e.preventDefault(); }
});

/* radiogroup-nuolinäppäimet */
document.addEventListener("keydown", function(e){
  if(["ArrowLeft","ArrowRight"].indexOf(e.key) < 0) return;
  var b = e.target.closest('[role="radio"]');
  if(!b) return;
  var grp = b.parentElement.querySelectorAll('[role="radio"]');
  var idx = Array.prototype.indexOf.call(grp, b);
  var next = grp[e.key === "ArrowLeft" ? Math.max(0, idx-1) : Math.min(grp.length-1, idx+1)];
  if(!next || next === b) { e.preventDefault(); return; }
  var k = next.getAttribute("data-rate"), v = next.getAttribute("data-v");
  next.click();                       /* tama piirtaa levyn uusiksi */
  var uusi = document.querySelector('[data-rate="'+k+'"][data-v="'+v+'"]');
  if(uusi){ try{ uusi.focus({preventScroll:true}); }catch(x){} }
  e.preventDefault();
});
